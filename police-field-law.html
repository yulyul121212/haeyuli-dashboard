{id:"fd1",tab:"현장",cat:"교통 단속",name:"운전자 신분증·면허증 제시 거부",art:"도로교통법 제92조·제155조 / 경직법 제3조",badges:[["p","20만원 이하 벌금 또는 구류"],["a","제시 요구권"]],sum:"운전 중 경찰관의 면허증 제시 요구·신원 질문에 응할 의무가 있고, 불응하면 20만원 이하 벌금 또는 구류",tip:"제시 거부만으로 공무집행방해가 되지는 않는다. 폭행·협박·차량 진행으로 요구를 회피할 때 검토.",text:"제92조(운전면허증 휴대 및 제시 등의 의무) ① 자동차등을 운전할 때에는 다음 각 호의 어느 하나에 해당하는 운전면허증 등을 지니고 있어야 한다. 1. 운전면허증, 제96조제1항에 따른 국제운전면허증 또는 상호인정외국면허증이나 「건설기계관리법」에 따른 건설기계조종사면허증(이하 “운전면허증등”이라 한다) 2. 운전면허증등을 갈음하는 다음 각 목의 증명서 가. 제91조에 따른 임시운전증명서 나. 제138조에 따른 범칙금 납부통고서 또는 출석지시서 다. 제143조제1항에 따른 출석고지서\n② 운전자는 운전 중에 교통안전이나 교통질서 유지를 위하여 경찰공무원이 제1항에 따른 운전면허증등 또는 이를 갈음하는 증명서를 제시할 것을 요구하거나 운전자의 신원 및 운전면허 확인을 위한 질문을 할 때에는 이에 응하여야 한다.\n③ 누구든지 다른 사람 명의의 모바일운전면허증을 부정하게 사용하여서는 아니 된다.\n\n제155조(벌칙) 제92조제2항을 위반하여 경찰공무원의 운전면허증등의 제시 요구나 운전자 확인을 위한 진술 요구에 따르지 아니한 사람은 20만원 이하의 벌금 또는 구류에 처한다.",steps:["안전한 장소로 유도해 정차시키고, 신분 표시 증표를 제시하며 소속·성명·단속 목적을 밝힌다(경직법 제3조④).","운전면허증등 제시를 요구하고, 신원·면허 확인을 위한 질문을 한다. 모바일운전면허증도 인정된다(제92조③은 타인 명의 사용만 금지).","거부 시 불응의 내용(면허증 미제시인지, 신원 질문 거부인지)을 구체적으로 특정해 2회 이상 고지하고, 그래도 불응하면 그 자체로 제92조② 위반임을 알린다.","차량 번호로 차적·면허 조회를 해 운전자 특정을 시도한다. 소유자 불일치·대포차·무면허 정황이면 추가 확인.","불응 사실이 확인되면 즉결심판 청구 대상으로 처리하고(20만원 이하 벌금·구류), 무면허·음주 등 다른 위반이 겹치면 그 부분을 별도 입건한다.","차량을 급출발시키거나 매달려 진행하는 등 폭행·협박·위험 운전이 동반되면 공무집행방해(형법 제136조)·특수공무방해 검토, 현행범 체포 가능."],say:"차량 번호 ○○○○, 운전자 확인을 위해 정차를 요청했습니다. 교통안전과 질서 유지를 위해 운전면허증 제시를 요구합니다. 제시에 응하지 않으면 도로교통법 제92조 제2항 위반으로 20만원 이하의 벌금 또는 구류에 처해질 수 있습니다. 신원과 면허 확인을 위한 질문에 답해 주시기 바랍니다.",caution:"제시 거부 자체는 20만원 이하 벌금·구류(즉결심판)이고 범칙금 통고 대상은 아니다. 공무집행방해는 별도로 ‘직무집행의 적법성 + 폭행·협박’이 있어야 성립하므로, 단순 거부에 방해죄를 얹지 않도록 주의. 차적 조회는 신원 특정 목적 범위에서 하고, 조회 결과를 조서에 남긴다.",ref:"도로교통법 [시행 2026.10.13.] 제92조·제155조 / 경찰관 직무집행법 제3조"},
{id:"fd2",tab:"현장",cat:"교통 단속",name:"음주측정 거부·채혈 요구",art:"도로교통법 제44조·제148조의2",badges:[["p","1년 이상 5년 이하 징역 또는 500만원 이상 2천만원 이하 벌금"],["x","현행범 체포 가능"]],sum:"술에 취했다고 인정할 만한 상당한 이유가 있는데 측정에 응하지 않으면 음주측정불응죄. 혈중 0.03% 이상이면 음주운전",tip:"혈액 채취는 운전자 동의를 받아 측정 결과에 불복할 때 다시 측정하는 절차(제44조③). 거부 자체를 곧바로 ‘채혈 강제’로 대체할 수는 없다.",text:"제44조(술에 취한 상태에서의 운전 금지) ② 경찰공무원은 교통의 안전과 위험방지를 위하여 필요하다고 인정하거나 제1항을 위반하여 술에 취한 상태에서 자동차등, 노면전차 또는 자전거를 운전하였다고 인정할 만한 상당한 이유가 있는 경우에는 운전자가 술에 취하였는지를 호흡조사로 측정할 수 있다. 이 경우 운전자는 경찰공무원의 측정에 응하여야 한다.\n③ 제2항에 따른 측정 결과에 불복하는 운전자에 대하여는 그 운전자의 동의를 받아 혈액 채취 등의 방법으로 다시 측정할 수 있다.\n④ 제1항에 따라 운전이 금지되는 술에 취한 상태의 기준은 운전자의 혈중알코올농도가 0.03퍼센트 이상인 경우로 한다.\n⑤ … 측정을 곤란하게 할 목적으로 추가로 술을 마시거나 혈중알코올농도에 영향을 줄 수 있는 의약품 등 행정안전부령으로 정하는 물품을 사용하는 행위(음주측정방해행위)를 하여서는 아니 된다.\n\n제148조의2(벌칙) ② 다음 각 호의 어느 하나에 해당하는 사람은 1년 이상 5년 이하의 징역이나 500만원 이상 2천만원 이하의 벌금에 처한다.\n1. 술에 취한 상태에 있다고 인정할 만한 상당한 이유가 있는 사람으로서 제44조제2항에 따른 경찰공무원의 측정에 응하지 아니하는 사람(자동차등 또는 노면전차를 운전한 경우로 한정한다)\n2. … 제44조제5항을 위반하여 자동차등 또는 노면전차를 운전한 후 음주측정방해행위를 한 사람\n③ 제44조제1항을 위반하여 술에 취한 상태에서 자동차등 또는 노면전차를 운전한 사람은 다음 각 호의 구분에 따라 처벌한다.\n1. 혈중알코올농도 0.2퍼센트 이상: 2년 이상 5년 이하 징역 또는 1천만원 이상 2천만원 이하 벌금\n2. 0.08퍼센트 이상 0.2퍼센트 미만: 1년 이상 2년 이하 징역 또는 500만원 이상 1천만원 이하 벌금\n3. 0.03퍼센트 이상 0.08퍼센트 미만: 1년 이하 징역 또는 500만원 이하 벌금\n\n※ 개인형 이동장치는 제148조의2 적용 제외 → 제156조 제11호(20만원 이하 벌금·구류·과료).",steps:["정차 후 시동·열쇠 관리, 운전자 하차 유도. 음주 감지 사유(냄새·발음·안색·흔들림·사고 정황)를 구체적으로 관찰·기록한다.","호흡측정 요구 전에 측정 목적·이유와 응할 의무를 고지하고, 측정 요구 시각을 기록한다.","1차 측정 불응 시 불응 의사를 명확히 재확인하고, 음주측정불응죄(제148조의2②1호, 1년 이상 5년 이하 징역 또는 500만원 이상 2천만원 이하 벌금) 성립을 고지한 뒤 다시 측정을 요구한다. 요구·고지·불응을 회차별로 조서에 남긴다.","측정에 응한 경우 결과를 수치로 기록하고, 운전자가 결과에 불복하면 동의를 받아 혈액 채취 등으로 재측정한다(제44조③). 채혈은 의료기관·의료인을 통해 하고 채혈 시각·용기·봉인을 기록.","불응이 확정되면 현행범인 체포(형소법 제212조)하고, 미란다 고지 후 48시간 내 구속영장 청구 여부를 검토한다. 석방 시에도 불응죄 입건은 유지.","측정 후 추가 음주·구강 세정·구토 유도 등 음주측정방해행위(제44조⑤)가 확인되면 별도로 1년 이상 5년 이하 징역 또는 500만원 이상 2천만원 이하 벌금."],"say":"음주운전이 의심되어 호흡측정을 요구합니다. 도로교통법 제44조에 따라 운전자는 측정에 응할 의무가 있습니다. 측정에 응하지 않으면 제148조의2에 따라 1년 이상 5년 이하의 징역 또는 500만원 이상 2천만원 이하의 벌금에 처해집니다. 측정에 응해 주시기 바랍니다.",caution:"‘3회 고지·시간 간격’ 같은 세부 횟수·간격은 법률이 아니라 소속 청·서의 음주단속 지침에 따른다. 법정 요건은 ①술에 취했다고 인정할 만한 상당한 이유 ②측정 요구 ③불응이다. 채혈은 동의가 전제이고, 거부만으로 강제 채혈할 수 없다. PM·자전거는 제148조의2가 적용되지 않으므로(제156조 제11호) 법정형을 혼동하지 않도록 주의.",ref:"도로교통법 [시행 2026.10.13.] 제44조·제148조의2 / 형사소송법 제212조"},
{id:"fd3",tab:"현장",cat:"재산·생활",name:"무전취식·무임승차 출동",art:"경범죄 처벌법 제3조 제1항 제39호 / 형법 제347조",badges:[["f","경범죄 범칙금 5만원"],["p","사기 20년 이하 징역·5천만원 이하 벌금"]],sum:"정당한 이유 없이 값을 치르지 않으면 경범죄(5만원). 처음부터 지불할 의사·능력이 없었다면 사기죄",tip:"구분 기준은 ‘처음부터 편취 의사’와 ‘지급 능력’. 단순 분실·착오·분쟁은 경범죄 또는 민사.",text:"경범죄 처벌법 제3조(경범죄의 종류) ① 다음 각 호의 어느 하나에 해당하는 사람은 10만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다.\n39. (무임승차 및 무전취식) 영업용 차 또는 배 등을 타거나 다른 사람이 파는 음식을 먹고 정당한 이유 없이 제 값을 치르지 아니한 사람\n※ 시행령 별표: 범칙금 5만원\n\n형법 제347조(사기) ① 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. <개정 2025.12.23.>",steps:["현장에서 업주·운전자에게 주문 내역·금액·미납 사실을 확인하고 영수증·메뉴판·CCTV 보존을 요청한다.","당사자에게 지불 능력·의사, 주문 경위(처음부터 지불 불가·타인 계산 기대 등), 동종 전과·상습성을 확인한다.","단순 미납·분쟁이면 경범죄 제3조①39로 처리해 범칙금 5만원 통고처분(피해자 특정·상습이면 즉결심판).","처음부터 지불할 의사·능력이 없었던 정황(신분·소지금 0원·허위 명의·반복 행위)이 명확하면 사기죄로 입건하고 현행범 체포를 검토한다.","현행범 체포 시 미란다 고지, 48시간 내 구속영장 청구 여부 판단. 소액·초범이면 불구속 수사.","업주가 처벌을 원하지 않는 단순 미납은 민사 안내가 적절하며, 합의 여부를 조서에 남긴다."],"say":"주문하신 음식 대금 ○○원을 지급하지 않으셨습니다. 단순 미납이면 경범죄처벌법에 따라 범칙금 5만원이 부과됩니다. 처음부터 지불할 의사나 능력이 없었다면 형법상 사기죄로 처벌될 수 있습니다. 지금 지불 여부와 경위를 확인하겠습니다.",caution:"‘돈이 없다’는 말만으로 사기죄가 되지 않는다. 편취 의사는 주문 당시 상황으로 입증해야 한다. 피해자인 업주가 특정되면 경범죄 제6조 제2항 제3호(피해자가 있는 행위)에 해당해 범칙자에서 제외되고 즉결심판 대상이 된다.",ref:"경범죄 처벌법 제3조①39 / 형법 제347조"},
{id:"fd4",tab:"현장",cat:"재산·생활",name:"식당·상가 영업방해·퇴거불응",art:"형법 제314조·제319조 제2항",badges:[["p","업무방해 5년 이하 징역·1천500만원 이하 벌금"],["p","퇴거불응 3년 이하 징역·500만원 이하 벌금"]],sum:"위력·위계로 영업을 방해하면 업무방해, 퇴거요구를 받고도 응하지 않으면 퇴거불응",tip:"퇴거불응은 ‘퇴거 요구’가 있어야 성립한다. 요구 시각·장소·방법을 명확히 하고, 요구 후 상당한 시간이 지나도 응하지 않아야 한다.",text:"형법 제314조(업무방해) ①제313조의 방법 또는 위력으로써 사람의 업무를 방해한 자는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다.\n\n형법 제319조(주거침입, 퇴거불응) ①사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다. ②전항의 장소에서 퇴거요구를 받고 응하지 아니한 자도 전항의 형과 같다.",steps:["출입 경위(손님인지, 종업원인지, 이해관계인인지)와 영업 방해 행태(고성·욕설·난동·좌석 점거·손님 차단)를 확인한다.","업주에게 영업권한·퇴거 요구 의사를 확인하고, 업주로 하여금 직접 또는 경찰관이 함께 ‘지금 퇴거’를 명확히 요구하게 한다.","퇴거 요구 시각을 기록하고, 요구 후에도 응하지 않을 때까지 상당한 시간을 둔다. 그 사이 2차 요구·고지.","CCTV·휴대폰 영상·목격자 진술·매출 영향(손님 이탈·영업 중단)을 확보한다. 영업방해 정도가 크면 업무방해로 입건.","계속 불응하면 퇴거불응으로 현행범 체포 검토(3년 이하 → 제214조 50만원 제한 대상 아님). 미란다 고지 후 처리.","주취·정신질환이 원인이면 보호조치(경직법 제4조) 또는 응급입원을 먼저 검토하고, 신체 위협이 있으면 분리·안전 확보를 최우선."],"say":"지금은 영업 중인 장소입니다. 업주께서 퇴거를 요구하셨습니다. 지금 나가주시기 바랍니다. 퇴거 요구에 응하지 않으면 형법 제319조 제2항에 따라 3년 이하의 징역 또는 500만원 이하의 벌금에 처해질 수 있습니다. 영업을 계속 방해하면 업무방해죄로도 처벌될 수 있습니다.",caution:"단순히 손님이 불만을 말하는 정도는 업무방해가 아니다. 위력의 정도·영업 방해의 결과가 필요하다. 퇴거불응은 건조물 관리·점유 권한이 있는 자의 요구가 전제이므로, 임차인·공동점유자 사이 분쟁은 민사로 안내.",ref:"형법 제314조·제319조"},
{id:"fd5",tab:"현장",cat:"주취·보호",name:"만취자 보호조치·관공서 주취소란",art:"경직법 제4조 / 경범죄 처벌법 제3조 제3항 제1호",badges:[["a","24시간 초과 금지"],["p","관공서 주취소란 60만원 이하"],["x","통고처분 불가"]],sum:"주취로 자신·타인에 위해 우려가 있으면 보호조치 가능(24시간). 관공서에서 주정하면 60만원 이하 벌금·구류·과료",tip:"관공서 주취소란은 현행 경범죄 처벌법(2026.10.2. 시행) 제3조 제3항 제1호에 존속한다. 시행령 별표에 없어 범칙금 통고처분 대상이 아니고 즉결심판으로 처리한다.",text:"경찰관 직무집행법 제4조(보호조치 등) ① 경찰관은 수상한 행동이나 그 밖의 주위 사정을 합리적으로 판단해 볼 때 다음 각 호의 어느 하나에 해당하는 것이 명백하고 응급구호가 필요하다고 믿을 만한 상당한 이유가 있는 사람(이하 “구호대상자”라 한다)을 발견하였을 때에는 보건의료기관이나 공공구호기관에 긴급구호를 요청하거나 경찰관서에 보호하는 등 적절한 조치를 할 수 있다.\n1. 정신착란을 일으키거나 술에 취하여 자신 또는 다른 사람의 생명ㆍ신체ㆍ재산에 위해를 끼칠 우려가 있는 사람\n2. 자살을 시도하는 사람\n3. 미아, 병자, 부상자 등으로서 적당한 보호자가 없으며 응급구호가 필요하다고 인정되는 사람. 다만, 본인이 구호를 거절하는 경우는 제외한다.\n③ 경찰관은 제1항의 조치를 하는 경우에 구호대상자가 휴대하고 있는 무기ㆍ흉기 등 위험을 일으킬 수 있는 것으로 인정되는 물건을 경찰관서에 임시로 영치(領置)하여 놓을 수 있다.\n④ 경찰관은 제1항의 조치를 하였을 때에는 지체 없이 구호대상자의 가족, 친지 또는 그 밖의 연고자에게 그 사실을 알려야 하며, 연고자가 발견되지 아니할 때에는 구호대상자를 적당한 공공보건의료기관이나 공공구호기관에 즉시 인계하여야 한다.\n⑦ 제1항에 따라 구호대상자를 경찰관서에서 보호하는 기간은 24시간을 초과할 수 없고, 제3항에 따라 물건을 경찰관서에 임시로 영치하는 기간은 10일을 초과할 수 없다.\n\n경범죄 처벌법 제3조 ③ 다음 각 호의 어느 하나에 해당하는 사람은 60만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다.\n1. (관공서에서의 주취소란) 술에 취한 채로 관공서에서 몹시 거친 말과 행동으로 주정하거나 시끄럽게 한 사람",steps:["의식·호흡·외상 확인, 흉기·위험물 소지 여부 확인해 임시 영치. 필요 시 119 구급 요청.","①주취로 자신·타인 위해 우려 ②자살시도 ③미아·병자·부상자 중 어디에 해당하는지 특정해 보호조치 여부 결정.","경찰관서 보호 시 보호 시작 시각을 기록하고, 가족·친지·연고자에게 지체 없이 통지한다. 연고자 없으면 공공의료기관·공공구호기관에 즉시 인계 후 서장 보고.","본인이 구호를 거절하는 경우(제1항 제3호 단서)에는 강제 보호가 아니라 안전 확인·연락처 확보 수준에서 대응.","관공서에서 주정하는 경우 소란 행위를 구체적으로 기록하고 2회 이상 자제 요청. 계속되면 관공서 주취소란(60만원 이하)으로 즉결심판 청구.","보호 24시간·영치 10일을 넘기지 않도록 시간을 관리하고, 연장이 필요하면 의료기관 이송 등 다른 조치로 전환."],"say":"지금 많이 취하셔서 혼자 두면 위험할 수 있습니다. 가족이나 지인에게 연락할 수 있도록 도와드리고, 필요하면 안전한 곳으로 모시겠습니다. 관공서 안에서 계속 소란을 피우시면 경범죄처벌법에 따라 60만원 이하의 벌금·구류 또는 과료로 처벌될 수 있습니다.",caution:"보호조치는 ‘구금’이 아니다. 신체를 묶거나 감금하는 방식은 허용되지 않고, 24시간을 넘길 수 없다. 관공서 주취소란은 통고처분(범칙금) 대상이 아니므로 현장에서 범칙금을 받겠다고 고지하면 안 된다. 주취 상태의 진술만으로 다른 범죄를 단정하지 말고, 필요 시 채혈·진료로 확인.",ref:"경찰관 직무집행법 제4조 / 경범죄 처벌법 제3조③1 (2026.10.2. 시행)"},
{id:"fd6",tab:"현장",cat:"가정·교제폭력",name:"가정폭력·교제폭력 출동",art:"가정폭력처벌법 제5조·제8조의2·제8조의3·제29조",badges:[["a","즉시 분리·제지"],["a","긴급임시조치 → 48시간 내 임시조치 청구"]],sum:"신고 받으면 즉시 현장 출동해 폭력 제지·당사자 분리, 피해자 의사 확인 후 상담소·보호시설·의료기관 인도, 재발 시 임시조치 안내. 긴급하면 긴급임시조치",tip:"가정폭력범죄는 가정폭력처벌법을 우선 적용하되, 아동학대범죄는 아동학대처벌법이 우선(제3조). 교제폭력은 스토킹처벌법·형법으로 대응.",text:"가정폭력처벌법 제5조(가정폭력범죄에 대한 응급조치) 진행 중인 가정폭력범죄에 대하여 신고를 받은 사법경찰관리는 즉시 현장에 나가서 다음 각 호의 조치를 하여야 한다.\n1. 폭력행위의 제지, 가정폭력행위자ㆍ피해자의 분리\n1의2. 「형사소송법」 제212조에 따른 현행범인의 체포 등 범죄수사\n2. 피해자를 가정폭력 관련 상담소 또는 보호시설로 인도(피해자가 동의한 경우만 해당한다)\n3. 긴급치료가 필요한 피해자를 의료기관으로 인도\n4. 폭력행위 재발 시 제8조에 따라 임시조치를 신청할 수 있음을 통보\n5. 제55조의2에 따른 피해자보호명령 또는 신변안전조치를 청구할 수 있음을 고지\n\n제8조의2(긴급임시조치) ① 사법경찰관은 제5조에 따른 응급조치에도 불구하고 가정폭력범죄가 재발될 우려가 있고, 긴급을 요하여 법원의 임시조치 결정을 받을 수 없을 때에는 직권 또는 피해자나 그 법정대리인의 신청에 의하여 제29조제1항제1호부터 제3호까지의 어느 하나에 해당하는 조치(이하 “긴급임시조치”라 한다)를 할 수 있다.\n② 사법경찰관은 제1항에 따라 긴급임시조치를 한 경우에는 즉시 긴급임시조치결정서를 작성하여야 한다.\n\n제8조의3(긴급임시조치와 임시조치의 청구) ① 사법경찰관이 제8조의2제1항에 따라 긴급임시조치를 한 때에는 지체 없이 검사에게 제8조에 따른 임시조치를 신청하고, 신청받은 검사는 법원에 임시조치를 청구하여야 한다. 이 경우 임시조치의 청구는 긴급임시조치를 한 때부터 48시간 이내에 청구하여야 하며, 긴급임시조치결정서를 첨부하여야 한다. ② 제1항에 따라 임시조치를 청구하지 아니하거나 법원이 임시조치의 결정을 하지 아니한 때에는 즉시 긴급임시조치를 취소하여야 한다.\n\n제29조(임시조치) ① 판사는 … 결정으로 가정폭력행위자에게 다음 각 호의 어느 하나에 해당하는 임시조치를 할 수 있다.\n1. 피해자 또는 가정구성원의 주거 또는 점유하는 방실로부터의 퇴거 등 격리\n2. 피해자 또는 가정구성원이나 그 주거ㆍ직장 등에서 100미터 이내의 접근 금지\n3. 피해자 또는 가정구성원에 대한 전기통신을 이용한 접근 금지\n4. 의료기관이나 그 밖의 요양소에의 위탁\n5. 국가경찰관서의 유치장 또는 구치소에의 유치\n6. 상담소등에의 상담위탁\n⑤ 제1항제1호부터 제3호까지의 임시조치기간은 2개월, 같은 항 제4호부터 제6호까지의 임시조치기간은 1개월을 초과할 수 없다.",steps:["출동 즉시 폭력행위를 제지하고 당사자를 분리한다. 피해자를 가해자와 다른 공간으로 옮기고, 필요 시 다른 경찰관이 가해자를 담당.","피해자 부상·진료 필요 확인, 119·의료기관 연계. 흉기·위험물 확인해 임시 영치.","피해자에게 ①상담소·보호시설 인도(동의 필요) ②임시조치 신청 가능 ③피해자보호명령·신변안전조치 청구 가능을 고지한다.","피해자의 처벌 의사·분리 의사·동거 지속 의사를 개별 확인하고, 가해자 앞에서 캐묻지 않는다(2차 피해 방지). 피해자 진술은 분리된 장소에서.","재발 우려 + 긴급하여 법원 결정을 받을 수 없으면 긴급임시조치(퇴거·격리, 100m 접근금지, 전기통신 접근금지)를 하고 즉시 결정서 작성.","긴급임시조치 후 지체 없이 검사에게 임시조치 신청(48시간 내 법원 청구). 청구되지 않거나 법원이 불허하면 즉시 긴급임시조치 취소.","현행범 체포 요건을 검토해 체포 시 미란다 고지, 48시간 내 구속영장 청구 판단. 아동이 있으면 아동학대처벌법 우선 적용·아동보호기관 연계."],"say":"가정폭력 신고로 출동했습니다. 지금 폭력행위를 멈추시고, 두 분을 분리하겠습니다. 피해자께서는 상담소나 보호시설로 안내해 드릴 수 있고, 폭력이 다시 발생할 우려가 있으면 법원에 임시조치를 신청할 수 있습니다. 긴급한 경우에는 접근금지 등 긴급임시조치를 할 수 있습니다.",caution:"피해자 보호시설 인도는 피해자 동의가 필요하다. ‘처벌하지 않겠다’는 말이 곧 사건 종결은 아니므로 가정폭력처벌법상 보호처분·상담조건부 기소유예 등 절차를 안내. 교제폭력(사실혼·연인)은 가정폭력처벌법의 ‘가정구성원’ 범위와 다르므로 스토킹처벌법·형법 적용을 검토하고, 피해자에게 112 신고·신변보호 절차를 안내.",ref:"가정폭력범죄의 처벌 등에 관한 특례법 [시행 2026.10.2.] 제3조·제5조·제8조의2·제8조의3·제29조·제55조의2"},
{id:"fd7",tab:"현장",cat:"공무집행",name:"공무집행방해 현장 대응",art:"형법 제136조·제144조",badges:[["p","5년 이하 징역·1천만원 이하 벌금"],["a","현행범 체포"]],sum:"직무를 집행하는 공무원에 대한 폭행·협박은 5년 이하 징역 또는 1천만원 이하 벌금. 단체·다중 위력·위험한 물건 휴대 시 2분의 1까지 가중",tip:"핵심은 ①직무집행의 적법성 ②폭행·협박의 존재. 고지·제지 내용과 영상, 목격자를 확보해야 한다.",text:"형법 제136조(공무집행방해) ①직무를 집행하는 공무원에 대하여 폭행 또는 협박한 자는 5년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. ②공무원에 대하여 그 직무상의 행위를 강요 또는 조지하거나 그 직을 사퇴하게 할 목적으로 폭행 또는 협박한 자도 전항의 형과 같다.\n\n형법 제144조(특수공무방해) ①단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제136조, 제138조와 제140조 내지 전조의 죄를 범한 때에는 각조에 정한 형의 2분의 1까지 가중한다. ②제1항의 죄를 범하여 공무원을 상해에 이르게 한 때에는 3년 이상의 유기징역에 처한다. 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다.",steps:["먼저 거리를 확보하고, 상대를 자극하지 않는 낮고 단호한 어조로 자제를 요청한다. 2인 1조로 접근.","경찰착용기록장치(웨어러블)를 작동하고, 촬영 사실을 고지한다(경직법 제10조의5·제10조의6). 주변 CCTV 위치·목격자 확보.","직무집행의 근거(불심검문·체포·보호조치 등)와 요구 내용을 다시 고지해 적법성을 명확히 한다.","폭행·협박이 있으면 즉시 중단시키고 상대를 제압·분리. 공무원 피해 부위 사진, 진단서, 동료 진술 확보.","현행범 체포 후 미란다 고지(형소법 제200조의5), 체포 이유·일시·장소 기록. 48시간 내 구속영장 청구 판단.","상대가 흉기를 들었거나 다중이면 특수공무방해(제144조)·경찰장구 사용(경직법 제10조의2) 검토, 무기 사용은 최후 수단."],"say":"지금 경찰관의 정당한 직무집행을 방해하고 계십니다. 폭행이나 협박을 계속하시면 형법 제136조에 따라 5년 이하의 징역 또는 1천만원 이하의 벌금에 처해지고 현행범으로 체포될 수 있습니다. 즉시 멈추고 협조해 주시기 바랍니다.",caution:"‘직무집행’이 적법해야 방해죄가 성립한다. 고지 없이 시작한 강제처분이나 권한 없는 요구는 적법성 다툼이 되므로, 요구 근거 조문을 말하고 기록한다. 촬영 고지는 원칙이지만 곤란한 경우 사유를 기록으로 대체할 수 있다(경직법 제10조의6②). 상대의 폭행이 정당방위·과잉방어 영역인지도 확인.",ref:"형법 제136조·제144조 / 경찰관 직무집행법 제10조의2·제10조의5·제10조의6 / 형사소송법 제200조의5"},
{id:"fd8",tab:"현장",cat:"교통 단속",name:"PM·픽시 청소년·무면허 단속",art:"도로교통법 제43조·제11조·제156조 / 형법 제9조",badges:[["f","PM 무면허 10만원"],["t","13세 미만 보호자 과태료 10만원"],["a","14세 미만 형사미성년"]],sum:"PM은 원동기 면허 이상 필요(16세 미만 불가). 13세 미만 어린이가 PM을 운전하면 보호자 과태료 10만원. 제동장치 없는 픽시는 안전운전의무 위반",tip:"형사미성년자(14세 미만)는 처벌 불가, 10세 이상 14세 미만은 촉법소년으로 소년법 절차. PM 무면허는 제156조 제13호(20만원 이하 벌금·구류·과료).",text:"도로교통법 제43조(무면허운전 등의 금지) 누구든지 제80조에 따라 시ㆍ도경찰청장으로부터 운전면허를 받지 아니하거나 운전면허의 효력이 정지된 경우에는 자동차등을 운전하여서는 아니 된다.\n제156조 13. 제43조를 위반하여 … 원동기장치자전거를 운전할 수 있는 운전면허를 받지 아니하거나 … 개인형 이동장치를 운전한 사람 → 20만원 이하 벌금·구류·과료 (범칙금 10만원)\n제11조 ④ 어린이의 보호자는 도로에서 어린이가 개인형 이동장치를 운전하게 하여서는 아니 된다.\n제160조 ② 9. 제11조제4항을 위반하여 어린이가 개인형 이동장치를 운전하게 한 어린이의 보호자 → 20만원 이하 과태료 (시행령 별표 6: 10만원)\n\n형법 제9조(형사미성년자) 14세되지 아니한 자의 행위는 벌하지 아니한다.\n※ 소년법 제4조: 10세 이상 14세 미만 소년은 촉법소년으로 보호사건 송치 대상.\n\n도로교통법 제48조 ① 모든 차의 운전자는 차의 조향장치와 제동장치, 그 밖의 장치를 정확하게 조작하여야 하며 … 다른 사람에게 위험과 장해를 주는 속도나 방법으로 운전하여서는 아니 된다.",steps:["안전한 장소에서 정지시키고 운전자 나이·면허 유무를 확인한다. 신분증이 없으면 보호자에게 연락.","나이 확인: 13세 미만이면 PM 운전 자체가 보호자 과태료 10만원 사유. 16세 미만은 원동기 면허 취득 불가이므로 무면허.","14세 미만은 형사처벌 불가(형법 제9조). 10세 이상 14세 미만은 촉법소년으로 소년법 보호사건 절차, 10세 미만은 보호자·학교 통보 및 계도.","14세 이상 16세 미만 무면허는 도로교통법 제156조 제13호로 처리(범칙금 10만원 통고 또는 즉결심판).","픽시(제동장치 제거)는 도로교통법 제48조① 안전운전의무 위반으로 계도·단속하고, 즉결심판 청구 대상. 18세 미만은 보호자 통보·경고, 반복 시 아동복지법상 방임 검토.","보호자에게 위반 내용·위험성·재발 시 처분을 설명하고, 안전모·보도주행·2인 탑승 등 동반 위반을 함께 계도한다."],"say":"이 개인형 이동장치는 원동기장치자전거 면허가 있어야 운전할 수 있습니다. 16세 미만은 면허를 받을 수 없어 무면허 운전이 됩니다. 13세 미만 어린이가 운전하면 보호자에게 10만원의 과태료가 부과됩니다. 제동장치를 뺀 자전거는 도로에서 타면 안전운전 의무 위반으로 단속됩니다.",caution:"나이는 생일 기준 만 나이로 확인한다. ‘촉법소년’이라는 말로 처벌 불가를 단정하지 말고, 소년법상 보호사건 송치·보호자 통보 등 실제 절차를 안내. PM 무면허 범칙금(10만원)과 형사처벌(20만원 이하 벌금·구류·과료)을 구분해 고지. 자전거법 개정(2027.1.8. 시행) 전에는 픽시를 자전거법 위반으로 처리할 수 없다.",ref:"도로교통법 제43조·제11조④·제48조①·제156조·제160조②9 / 형법 제9조 / 자전거법 제20조의2(2027.1.8. 시행)"},
{id:"fd9",tab:"현장",cat:"재산·생활",name:"112 허위신고·거짓신고 처리",art:"경범죄 처벌법 제3조 제3항 제2호 / 형법 제156조",badges:[["p","경범 60만원 이하"],["p","무고 10년 이하 징역·1천500만원 이하 벌금"],["x","통고처분 불가"]],sum:"없는 범죄·재해를 거짓 신고하면 60만원 이하 벌금·구류·과료. 특정인을 범인으로 지목해 처벌받게 할 목적이면 무고죄",tip:"경범죄 거짓신고는 시행령 별표에 없어 범칙금 통고 불가. 반복 허위신고는 즉결심판 청구, 무고 해당 시 정식 수사.",text:"경범죄 처벌법 제3조 ③ 다음 각 호의 어느 하나에 해당하는 사람은 60만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다.\n2. (거짓신고) 있지 아니한 범죄나 재해 사실을 공무원에게 거짓으로 신고한 사람\n\n형법 제156조(무고) 타인으로 하여금 형사처분 또는 징계처분을 받게 할 목적으로 공무소 또는 공무원에 대하여 허위의 사실을 신고한 자는 10년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다.",steps:["출동 결과 신고 내용이 허위임을 확인하고, 신고 녹취·통화 기록·출동 기록을 확보한다.","허위의 범위(전부 허위인지, 일부 과장인지)와 신고 경위(장난·주취·보복)를 확인한다.","특정인을 범인으로 지목했는지 확인 — 지목했다면 무고죄 검토, 단순 허위 출동 요청이면 경범죄.","반복·상습이면 즉결심판 청구, 무고 해당 시 정식 수사로 전환하고 신고자 신원·진술을 조서로 정리.","신고자에게 허위신고의 처벌 내용을 고지하고 재발 시 처분을 안내. 정신질환·주취가 원인이면 복지·의료 연계를 함께 검토."],"say":"확인 결과 신고하신 범죄나 재해 사실이 실제로 확인되지 않았습니다. 없던 범죄를 거짓 신고하면 경범죄처벌법에 따라 60만원 이하의 벌금·구류 또는 과료로 처벌될 수 있고, 특정인을 범인으로 지목했다면 무고죄로 더 무겁게 처벌될 수 있습니다.",caution:"신고 내용이 사실과 다르더라도 신고자가 착오였던 경우까지 처벌하면 안 된다. ‘허위’임을 알고 신고했는지가 핵심. 무고는 ‘타인에게 형사처분을 받게 할 목적’이 필요하므로, 단순 허위 출동 요청과 구분한다. 통고처분 불가 조문이므로 범칙금 고지는 하지 않는다.",ref:"경범죄 처벌법 제3조③2 / 형법 제156조"},

 text:"가정폭력처벌법 제5조(응급조치): ① 폭력행위의 제지, 가정폭력행위자·피해자의 분리 ② 현행범인 체포 등 범죄수사 ③ 피해자를 상담소·보호시설로 인도(피해자 동의) ④ 긴급치료가 필요한 피해자를 의료기관으로 인도 ⑤ 폭력행위 재발 시 제8조에 따라 임시조치를 신청할 수 있음을 통보 ⑥ 피해자보호명령·신변안전조치를 청구할 수 있음을 고지\n\n제8조의2(긴급임시조치): 응급조치에도 불구하고 재발 우려가 있고 긴급하여 법원의 임시조치 결정을 받을 수 없을 때 직권 또는 피해자·법정대리인 신청으로 제29조제1항제1호(퇴거 등 격리)·제2호(100m 이내 접근금지)·제3호(전기통신 이용 접근금지)를 할 수 있다. 즉시 긴급임시조치결정서 작성.\n제8조의3: 긴급임시조치 후 지체 없이 검사에게 임시조치 신청, 48시간 이내 법원 청구. 청구되지 않거나 불허되면 즉시 취소.",

 levels:[{min:2,cls:"warn",title:"고위험 — 즉각 분리·응급조치 필요",text:"제12조제1항 응급조치(제지·가해자 격리·보호시설 또는 의료기관 인도)를 즉시 시행하고 응급조치결과보고서 작성. 아동학대전담공무원·아동보호전문기관 통보, 필요 시 현행범 체포. 72시간 내 임시조치 청구 준비."},{min:1,cls:"soon",title:"의심 — 응급조치 + 확인조사 병행",text:"아동을 가해자와 분리해 조사하고, 아동학대전담공무원과 합동조사·사례판단 의뢰. 부상·방임 정황에 따라 의료기관 인도·일시보호조치 검토."},{min:0,cls:"info",title:"신호 낮음 — 기록·연계 위주",text:"현장 상황과 아동 진술을 기록하고, 아동보호전문기관·지자체 연계 및 재신고 시 조치 절차를 안내. 귀가 후 안전 확인 방법을 설명."}],
 say:"아동학대 신고로 출동했습니다. 지금 아이와 분리해서 이야기를 듣겠습니다. 아이의 안전을 위해 필요하면 보호시설이나 의료기관으로 인도할 수 있고, 학대행위자에 대해서는 접근금지 등 임시조치를 법원에 청구할 수 있습니다.",
 caution:"즉각분리는 응급조치(제12조①2·3호)와 지자체 일시보호조치(아동복지법 제15조⑥)로 이뤄진다. 응급조치 기간 72시간(공휴일·토요일 포함 시 48시간 연장)을 넘기지 않도록 임시조치 청구 시한을 관리. 아동에게 학대 여부를 반복해 캐묻거나 보호자 앞에서 진술을 요구하지 않는다.",
 text:"아동학대처벌법 제12조(피해아동 등에 대한 응급조치) ① 현장에 출동하거나 아동학대범죄 현장을 발견한 경우 또는 학대현장 이외의 장소에서 학대피해가 확인되고 재학대의 위험이 급박·현저한 경우, 사법경찰관리 또는 아동학대전담공무원은 피해아동, 피해아동의 형제자매인 아동 및 피해아동과 동거하는 아동(피해아동등)의 보호를 위하여 즉시 다음 각 호의 조치를 하여야 한다.\n1. 아동학대범죄 행위의 제지\n2. 아동학대행위자를 피해아동등으로부터 격리\n3. 피해아동등을 아동학대 관련 보호시설로 인도\n4. 긴급치료가 필요한 피해아동을 의료기관으로 인도\n5. 피해아동등을 연고자 등에게 인도\n③ 제1항제2호부터 제5호까지에 따른 응급조치는 72시간을 넘을 수 없다. 다만, 그 기간에 공휴일이나 토요일이 포함되는 경우로서 피해아동등의 보호를 위하여 필요하다고 인정되는 경우에는 48시간의 범위에서 그 기간을 연장할 수 있다.\n④ 검사가 제15조제2항에 따라 임시조치를 법원에 청구한 경우에는 법원의 임시조치 결정 시까지 응급조치 기간이 연장된다.\n\n제13조(아동학대행위자에 대한 긴급임시조치) ① 응급조치에도 불구하고 아동학대범죄가 재발될 우려가 있고, 긴급을 요하여 제19조제1항에 따른 법원의 임시조치 결정을 받을 수 없을 때에는 직권이나 피해아동등·법정대리인·변호사·시·도지사·시장·군수·구청장 또는 아동보호전문기관의 장의 신청에 따라 제19조제1항제1호부터 제3호까지의 조치를 할 수 있다.\n\n아동복지법 제15조 ⑥ 시·도지사 또는 시장·군수·구청장은 다음 각 호의 어느 하나에 해당하는 경우 … 아동일시보호시설, 학대피해아동쉼터 등에 보호대상아동을 입소시켜 보호하거나 … 일시 위탁하여 보호(일시보호조치)하게 할 수 있다.\n1. 1년 이내에 2회 이상 아동학대 신고가 접수된 아동에 대하여 현장조사 과정에서 학대피해가 강하게 의심되고 재학대가 발생할 우려가 있는 경우\n2. … 응급조치 또는 긴급임시조치가 종료되었으나 임시조치가 청구되지 아니한 경우\n3. 현장조사 과정에서 아동의 보호자가 아동에게 답변을 거부·기피 또는 거짓 답변을 하게 하거나 그 답변을 방해한 경우",

 {k:"현장",ic:"📋",lb:"현장대응"},
 {k:"형법",ic:"⚖️",lb:"형법"},
 {k:"형소법",ic:"👮",lb:"형소법"},
 {k:"교통",ic:"🛴",lb:"교통·PM"},
 {k:"최신",ic:"📰",lb:"최신법"},
 {k:"★",ic:"★",lb:"즐겨찾기"}
];
const CATS={
 "경범죄":["전체","제3조 ① (10만원 이하)","제3조 ② (20만원 이하)","제3조 ③ (60만원 이하)","총칙"],
 "현장":["전체","가정폭력 체크","아동학대 체크","교통 단속","재산·생활","주취·보호","가정·교제폭력","공무집행"],
 "형법":["전체","폭력·신체","재산","주거·업무·공무","성·명예","공안·교통","총칙"],
 "형소법":["전체","체포","구속","압수·수색","경찰 직무","수사 원칙"],
 "교통":["전체","PM 기본","PM 음주","PM 안전","PM 통행","픽시·자전거"],
 "최신":["전체","마약 수사","형법 개정","형소법 개정","경범죄 개정","자전거법 개정"]
};
const S={tab:"경범죄",cat:{"경범죄":"전체"},q:"",fs:"md",theme:"day",fav:[]};
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s||"").toLowerCase().replace(/[\s·ㆍ,.\(\)\[\]\-~]/g,"");

/* ---- 저장 ---- */
function load(){
  try{
    const f=JSON.parse(localStorage.getItem("pfl.fav")||"[]"); if(Array.isArray(f)) S.fav=f;
    const t=localStorage.getItem("pfl.theme"); if(t) S.theme=t;
    const z=localStorage.getItem("pfl.fs"); if(z) S.fs=z;
    const c=JSON.parse(localStorage.getItem("pfl.checks")||"{}"); S.checks=c||{};
  }catch(e){ S.checks={}; }
  if(!S.checks) S.checks={};
  document.documentElement.dataset.theme=S.theme;
  document.documentElement.dataset.fs=S.fs;
}
function saveFav(){ try{localStorage.setItem("pfl.fav",JSON.stringify(S.fav))}catch(e){} }
function saveChecks(){ try{localStorage.setItem("pfl.checks",JSON.stringify(S.checks))}catch(e){} }

/* ---- 검색 ---- */
function hay(it){
  const ck=(it.checks||[]).map(c=>c.t+" "+c.a).join(" ");
  return norm([it.name,it.art,it.sum,it.tip,it.text,it.cat,it.tab,it.keys,ck,it.when].join(" "));
}
function matches(it,q){ return hay(it).indexOf(q)>=0; }

/* ---- 렌더 ---- */
function renderChips(){
  const box=$("#chips");
  if(S.q){ box.innerHTML=""; box.style.display="none"; return; }
  box.style.display="flex";
  const cats=CATS[S.tab]||["전체"];
  box.innerHTML=cats.map(c=>`<button class="chip ${S.cat[S.tab]===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function score(it,q){
  let s=0;
  const n=norm(it.name), a=norm(it.art), k=norm(it.keys||""), su=norm(it.sum||""),
        tp=norm((it.tip||"")+(it.when||"")), tx=norm(it.text||""), ct=norm(it.cat+" "+(it.tab||""));
  if(n.indexOf(q)>=0) s+=100;
  if(a.indexOf(q)>=0) s+=80;
  if(k.indexOf(q)>=0) s+=65;
  if(su.indexOf(q)>=0) s+=35;
  if(ct.indexOf(q)>=0) s+=25;
  if(tp.indexOf(q)>=0) s+=15;
  if(tx.indexOf(q)>=0) s+=5;
  if(it.kind==="check") s+=3;
  return s;
}
function listItems(){
  const q=norm(S.q);
  if(q){
    return DATA.filter(it=>matches(it,q))
      .map((it,i)=>({it,i,s:score(it,q)}))
      .sort((x,y)=> y.s-x.s || x.i-y.i)
      .map(x=>x.it);
  }
  if(S.tab==="★") return DATA.filter(it=>S.fav.indexOf(it.id)>=0);
  const cat=S.cat[S.tab]||"전체";
  return DATA.filter(it=>it.tab===S.tab && (cat==="전체"||it.cat===cat));
}
function badgeHTML(it){
  return (it.badges||[]).map(b=>`<span class="b ${b[0]}">${esc(b[1])}</span>`).join("");
}
function cardHTML(it){
  const on=S.fav.indexOf(it.id)>=0;
  const tabTag = S.q ? `<span class="b a" style="font-weight:700">${esc(it.tab)}</span>` : "";
  return `<article class="card" data-tab="${esc(it.tab)}" data-id="${it.id}">
    <div class="ctop">
      <div style="flex:1;min-width:0">
        <div class="cname">${esc(it.name)}</div>
        <div class="cart">${esc(it.art)}</div>
      </div>
      <button class="star ${on?"on":""}" data-star="${it.id}" aria-label="즐겨찾기">${on?"★":"☆"}</button>
    </div>
    <div class="badges">${tabTag}${badgeHTML(it)}</div>
    <div class="sum">${esc(it.sum)}</div>
    ${it.kind==="check"?`<div class="tagline">☑ 체크리스트 · 항목을 눌러 조치 판단</div>`:""}
  </article>`;
}
function render(){
  load2set();
  renderChips();
  const items=listItems();
  const q=norm(S.q);
  const list=$("#list");
  let head="";
  if(q){
    head=`<div class="sechead"><h2>통합검색 “${esc(S.q)}”</h2><span class="cnt">${items.length}건 · 전 탭</span></div>`;
  }else if(S.tab==="★"){
    head=`<div class="sechead"><h2>★ 즐겨찾기</h2><span class="cnt">${items.length}건</span></div>`;
  }else{
    head=`<div class="sechead"><h2>${esc(S.tab)}</h2><span class="cnt">${items.length}건</span></div>`;
  }
  let body="";
  if(!items.length){
    body = q
      ? `<div class="empty"><b>검색 결과가 없습니다</b>“${esc(S.q)}”에 해당하는 조문이 없습니다.<br>다른 키워드(예: 노상방뇨, 미란다, 50만원, 임의동행, 킥보드, 가폭, 아동학대)로 검색해 보세요.</div>`
      : (S.tab==="★" ? `<div class="empty"><b>즐겨찾기가 비어 있습니다</b>조문 카드의 ☆를 눌러 자주 쓰는 항목을 고정하세요.</div>`
        : `<div class="empty"><b>항목이 없습니다</b>다른 카테고리를 선택하세요.</div>`);
  }else{
    body = items.map(cardHTML).join("");
  }
  list.innerHTML = head + (S.tab==="경범죄"&&!q?`<div class="note"><b>경범죄 처벌법 기준</b> 법정형(10만·20만·60만원 이하 벌금)과 통고처분 범칙금(시행령 별표)은 다릅니다. 피해자가 있는 행위·상습범·18세 미만은 범칙금 통고 대상에서 제외됩니다.</div>`:"")
   + (S.tab==="최신"&&!q?`<div class="note"><b>[현행] / [개정·시행예정] 구분</b> 기준일 2026-11-24. 시행 전 조문은 현장 적용이 불가하므로 배지를 확인하세요.</div>`:"")
   + body
   + `<div class="foot">법령 기준일 2026-11-24 · 국가법령정보센터(law.go.kr) 현행 조문 확인<br>본 앱은 현장 참고용이며, 최종 판단은 소속 지침·판례·검사 지휘에 따릅니다.</div>`;
  renderTabs();
}
function load2set(){
  document.documentElement.dataset.theme=S.theme;
  document.documentElement.dataset.fs=S.fs;
  $("#themeBtn").textContent = S.theme==="night" ? "☀️ 주간" : "🌙 야간";
  $("#fsBtn").textContent = S.fs==="md"?"가":S.fs==="lg"?"가+":"가++";
  const b=$("#basis"); if(b) b.textContent="기준일 2026-11-24 · 국가법령정보센터 확인";
}
function renderTabs(){
  $("#tabbar").innerHTML=TABS.map(t=>{
    const on=(S.tab===t.k && !S.q);
    return `<button class="tabbtn ${on?"on":""}" data-tab="${t.k}"><span class="ic">${t.ic}</span><span class="lb">${t.lb}</span></button>`;
  }).join("");
}

/* ---- 상세 시트 ---- */
let CUR=null;
function openSheet(id){
  const it=DATA.find(x=>x.id===id); if(!it) return;
  CUR=it;
  const on=S.fav.indexOf(it.id)>=0;
  let html=`<button class="closer" data-close="1">✕</button>
  <div class="handle"><i></i></div><div class="inner">
  <h3>${esc(it.name)}</h3>
  <div class="meta">${esc(it.art)}${it.tab?" · "+esc(it.tab):""}</div>
  <div class="badges">${badgeHTML(it)}</div>`;
  if(it.kind==="miranda"){
    const L=(it.text||"").split("\n").map(s=>s.trim()).filter(Boolean).filter(s=>s.indexOf("【")!==0);
    const head=L.shift()||"";
    html+=`<div class="miranda"><div class="who">현장 고지 — 그대로 읽어주기</div>
      <div class="big">${esc(head)}</div>
      <div class="mitems">${L.map(s=>`<p>${esc(s)}</p>`).join("")}</div>
      <div class="sub">한 문장씩 읽고, 이해 여부와 변호인 선임·통지받을 사람·진술 여부를 확인한 뒤 조서에 적으세요.</div></div>`;
  } 
  else if(it.kind==="check"){
    html+=`<div class="block"><h4>언제 쓰나요</h4><p>${esc((it.when||"").replace(/^사용 시점\s*[—-]\s*/,""))}</p></div>`;
    html+=`<div class="block tip"><h4>체크리스트 — 해당 항목을 누르세요</h4><div id="chk">`+
      (it.checks||[]).map((c,i)=>`<label class="ckrow"><input type="checkbox" data-ck="${i}" ${((S.checks[it.id]||[]).indexOf(i)>=0)?"checked":""}><span class="ckbox"></span><span class="cklabel">${esc(c.t)}${c.w===2?' <em class="hi">고위험</em>':''}</span></label><div class="ckadv" data-adv="${i}"></div>`).join("")+
      `</div></div>`;
    html+=`<div id="result"></div>`;
  }
  else{
    if(it.sum) html+=`<div class="block"><h4>요약</h4><p>${esc(it.sum)}</p></div>`;
    if(it.steps) html+=`<div class="block"><h4>단계별 현장 대응</h4><p>`+it.steps.map((s,i)=>`${i+1}. ${esc(s)}`).join("\n")+`</p></div>`;
    if(it.say) html+=`<div class="block tip"><h4>현장 고지 멘트</h4><p>${esc(it.say)}</p></div>`;
    if(it.tip) html+=`<div class="block tip"><h4>현장 포인트</h4><p>${esc(it.tip)}</p></div>`;
    if(it.caution) html+=`<div class="block warn"><h4>주의사항</h4><p>${esc(it.caution)}</p></div>`;
    if(it.text) html+=`<div class="block quote"><h4>법조문</h4><p>${esc(it.text)}</p></div>`;
  }
  html+=`<div class="btnrow"><button class="pri" data-copy="quote">조문 복사</button><button data-copy="say">멘트 복사</button></div>`;
  html+=`<div class="btnrow"><button data-fav="${it.id}">${on?"★ 즐겨찾기 해제":"☆ 즐겨찾기 추가"}</button><button data-close="1">닫기</button></div>`;
  if(it.ref) html+=`<div class="foot">출처: ${esc(it.ref)}<br>기준일 2026-11-24 · 본 내용은 현장 참고용입니다.</div>`;
  html+=`</div>`;
  $("#sheetbody").innerHTML=html;
  $("#sheet").classList.add("on");
  document.body.style.overflow="hidden";
  if(it.kind==="check") updateCheckUI();
}
function closeSheet(){
  $("#sheet").classList.remove("on");
  document.body.style.overflow="";
  CUR=null;
}
function updateCheckUI(){
  if(!CUR||CUR.kind!=="check") return;
  const it=CUR, sel=S.checks[it.id]||[];
  (it.checks||[]).forEach((c,i)=>{
    const adv=$(`[data-adv="${i}"]`,$("#chk"));
    if(adv) adv.innerHTML = sel.indexOf(i)>=0 ? `<div class="ckadvbox">→ ${esc(c.a)}</div>` : "";
  });
  let score=0; (it.checks||[]).forEach((c,i)=>{ if(sel.indexOf(i)>=0) score+=(c.w||0); });
  let lv=it.levels[it.levels.length-1];
  for(const l of it.levels){ if(score>=l.min){ lv=l; break; } }
  const n=sel.length;
  const acts=(it.checks||[]).filter((c,i)=>sel.indexOf(i)>=0).map(c=>c.a);
  $("#result").innerHTML=`<div class="block ${lv.cls==="warn"?"warn":"tip"}">
    <h4>판단 결과 — 체크 ${n}개 · 위험도 점수 ${score}</h4>
    <p><b>${esc(lv.title)}</b>
${esc(lv.text)}</p>
  </div>
  ${acts.length?`<div class="block"><h4>체크 항목별 권장 조치</h4><p>${acts.map((a,i)=>`• ${esc(a)}`).join("\n")}</p></div>`:""}
  <div class="block tip"><h4>현장 고지 멘트</h4><p>${esc(it.say||"")}</p></div>
  <div class="block warn"><h4>주의사항</h4><p>${esc(it.caution||"")}</p></div>
  <div class="block quote"><h4>근거 법조문</h4><p>${esc(it.text||"")}</p></div>`;
  const b=$("[data-refresh]");
}
function toggleCheck(idx){
  if(!CUR) return;
  const arr=S.checks[CUR.id]||[];
  const p=arr.indexOf(idx);
  if(p>=0) arr.splice(p,1); else arr.push(idx);
  S.checks[CUR.id]=arr; saveChecks(); updateCheckUI();
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1600);
}
function manualCopy(txt){
  $(".sheetbody")||null;
  const sb=$("#sheetbody");
  sb.innerHTML=`<button class="closer" data-close="1">✕</button><div class="handle"><i></i></div><div class="inner">
    <h3>직접 복사</h3>
    <div class="meta">아래 글을 길게 눌러 전체 선택 후 복사하세요</div>
    <textarea id="copybox" readonly style="width:100%;height:46dvh;font-family:inherit;font-size:var(--fs-s);line-height:1.55;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink)"></textarea>
    <div class="btnrow"><button class="pri" data-close="1">닫기</button></div></div>`;
  const ta=$("#copybox"); ta.value=txt; ta.focus(); ta.select();
  $(".sheet").classList.add("on"); document.body.style.overflow="hidden";
}
async function copyText(txt,label){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){
      await navigator.clipboard.writeText(txt); toast(label+" 복사되었습니다"); return;
    }
  }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length);
    const ok=document.execCommand("copy"); ta.remove();
    if(ok){ toast(label+" 복사되었습니다"); return; }
  }catch(e){}
  toast("자동 복사가 차단되어 직접 복사 창을 엽니다");
  manualCopy(txt);
}

/* ---- 이벤트 ---- */
$("#tabbar").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; S.q=""; $("#q").value=""; $("#clearQ").classList.remove("on");
  window.scrollTo(0,0); render();
});
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest("[data-cat]"); if(!b) return;
  S.cat[S.tab]=b.dataset.cat; render();
});
$("#list").addEventListener("click",e=>{
  const st=e.target.closest("[data-star]");
  if(st){ e.stopPropagation(); toggleFav(st.dataset.star); return; }
  const c=e.target.closest(".card"); if(c) openSheet(c.dataset.id);
});
function toggleFav(id){
  const i=S.fav.indexOf(id);
  if(i>=0) S.fav.splice(i,1); else S.fav.push(id);
  saveFav(); render();
  if(CUR&&CUR.id===id){ const b=$(`[data-fav="${id}"]`); if(b) b.textContent = S.fav.indexOf(id)>=0?"★ 즐겨찾기 해제":"☆ 즐겨찾기 추가"; }
  toast(S.fav.indexOf(id)>=0?"즐겨찾기에 추가했습니다":"즐겨찾기에서 제거했습니다");
}
$("#sheet").addEventListener("change",e=>{
  const inp=e.target.closest("input[data-ck]");
  if(!inp||!CUR) return;
  const i=parseInt(inp.dataset.ck,10);
  const arr=(S.checks[CUR.id]||[]).slice();
  const p=arr.indexOf(i);
  if(inp.checked){ if(p<0) arr.push(i); } else { if(p>=0) arr.splice(p,1); }
  S.checks[CUR.id]=arr; saveChecks(); updateCheckUI();
});
$("#sheet").addEventListener("click",e=>{
  if(e.target.id==="sheet"){ closeSheet(); return; }
  if(e.target.closest("[data-close]")){ closeSheet(); return; }
  const cp=e.target.closest("[data-copy]");
  if(cp&&CUR){ copyText(cp.dataset.copy==="say"?(CUR.say||CUR.text):(CUR.text||CUR.sum), cp.dataset.copy==="say"?"고지 멘트가":"조문이"); return; }
  const fv=e.target.closest("[data-fav]");
  if(fv){ toggleFav(fv.dataset.fav); return; }
});
let qt=null;
$("#q").addEventListener("input",e=>{
  const v=e.target.value;
  $("#clearQ").classList.toggle("on",!!v);
  clearTimeout(qt); qt=setTimeout(()=>{ S.q=v; render(); },90);
});
$("#clearQ").addEventListener("click",()=>{ $("#q").value=""; S.q=""; $("#clearQ").classList.remove("on"); render(); $("#q").focus(); });
$("#themeBtn").addEventListener("click",()=>{ S.theme=S.theme==="night"?"day":"night"; localStorage.setItem("pfl.theme",S.theme); load2set(); });
$("#fsBtn").addEventListener("click",()=>{ S.fs=S.fs==="md"?"lg":S.fs==="lg"?"xl":"md"; localStorage.setItem("pfl.fs",S.fs); load2set(); toast(S.fs==="md"?"글자 보통":S.fs==="lg"?"글자 크게":"글자 아주 크게"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

load(); render();
</script>
</body>
</html>
