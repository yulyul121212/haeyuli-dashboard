<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f59e0b">
<title>실사 영단어 슬라이드 · 하루 10개</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:#f4f5f8;color:#1f2430;line-height:1.45;
    min-height:100vh;-webkit-text-size-adjust:100%;
  }
  .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    padding:0 12px calc(10px + env(safe-area-inset-bottom));}
  /* ---------- header ---------- */
  header{padding:calc(12px + env(safe-area-inset-top)) 4px 8px;display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;border-radius:12px;background:#fff7e6;display:grid;place-items:center;font-size:21px;flex:0 0 auto;
    box-shadow:0 1px 3px rgba(24,29,45,.08)}
  header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  header p{margin:1px 0 0;font-size:12px;color:#7b8194;font-weight:600}
  /* ---------- day tabs ---------- */
  .days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:1 0 auto;min-width:62px;padding:8px 10px;border-radius:13px;border:1.5px solid #e6e8f0;background:#fff;
    font:inherit;font-size:12.5px;font-weight:800;color:#6b7086;display:flex;flex-direction:column;align-items:center;gap:1px;
    cursor:pointer;transition:transform .1s ease,border-color .15s,background .15s,color .15s;
  }
  .day:active{transform:scale(.96)}
  .day .st{font-size:10px;line-height:1}
  .day.on{background:#1f2430;border-color:#1f2430;color:#fff}
  .day.done:not(.on){border-color:#ffd479;background:#fffaef;color:#8a6100}
  /* ---------- toolbar chips ---------- */
  .toolbar{display:flex;gap:6px;padding:0 2px 10px;overflow-x:auto;scrollbar-width:none;align-items:center}
  .toolbar::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1.5px solid #e6e8f0;background:#fff;
    color:#6b7086;font:inherit;font-size:12.5px;font-weight:800;padding:8px 12px;border-radius:999px;cursor:pointer;
    line-height:1.15;transition:transform .1s ease,border-color .15s,background .15s,color .15s
  }
  .chip:active{transform:scale(.96)}
  .chip.on{background:#fff4dc;border-color:#f6c56b;color:#8a6100}
  /* ---------- mode tabs ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e9ebf2;border-radius:15px;padding:4px;margin:0 2px 10px}
  .mode{
    border:0;background:transparent;color:#6b7086;font:inherit;font-size:13px;font-weight:800;padding:9px 6px;
    border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.1
  }
  .mode:active{transform:scale(.98)}
  .mode.on{background:#fff;color:#1f2430;box-shadow:0 1px 4px rgba(24,29,45,.14)}
  /* ---------- slide ---------- */
  main{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
  /* ---------- photo ---------- */
  .stage{position:relative}
  .photoBox{
    position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:#e9ebf0;
    box-shadow:0 8px 22px rgba(24,29,45,.10);touch-action:pan-y;isolation:isolate;
  }
  .photoBox .bg{
    position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
    filter:blur(26px) saturate(.82) brightness(1.14);transform:scale(1.16);z-index:0
  }
  .photoBox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;z-index:1;
    animation:slideIn .28s ease both}
  @keyframes slideIn{from{opacity:.25;transform:translateX(14px) scale(1.015)}to{opacity:1;transform:none}}
  .photoBox .count{
    position:absolute;top:10px;right:10px;padding:5px 10px;border-radius:999px;background:rgba(20,22,30,.55);
    color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.02em;backdrop-filter:blur(4px);z-index:3
  }
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;
    background:rgba(255,255,255,.86);color:#242a38;font-size:15px;font-weight:800;display:grid;place-items:center;
    box-shadow:0 2px 10px rgba(20,24,40,.18);cursor:pointer;padding:0;line-height:1;z-index:3
  }
  .nav:active{transform:translateY(-50%) scale(.93)}
  .nav.prev{left:8px}
  .nav.next{right:8px}
  .nav[disabled]{opacity:.32}
  /* ---------- dots ---------- */
  .dots{display:flex;justify-content:center;align-items:center;gap:6px;padding:12px 0 4px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:#d5d8e2;border:0;padding:0;cursor:pointer;transition:all .16s}
  .dot.on{background:#f59e0b;width:22px;border-radius:6px}
  /* ---------- word ---------- */
  .wordRow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .word{margin:0;font-size:clamp(30px,8.6vw,44px);font-weight:900;letter-spacing:-.02em;line-height:1.1;text-align:center}
  .koWord{margin:4px 0 0;text-align:center;font-size:15px;font-weight:800;color:#8a6100}
  /* ---------- practice (pictures hidden) ---------- */
  .practice{display:flex;flex-direction:column}
  .piclessRow{display:none;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
  .count2{min-width:58px;text-align:center;font-size:13px;font-weight:800;color:#7b8194;letter-spacing:.04em}
  .navBtn{
    width:38px;height:38px;border-radius:50%;border:1.5px solid #e6e8f0;background:#fff;color:#242a38;
    font-size:13px;font-weight:800;display:grid;place-items:center;padding:0;cursor:pointer;line-height:1;flex:0 0 auto
  }
  .navBtn:active{transform:scale(.93)}
  .navBtn[disabled]{opacity:.3}
  body.nopic .photoBox{display:none}
  body.nopic .practice{
    background:#fff;border-radius:24px;padding:20px 16px 22px;margin-top:2px;
    box-shadow:0 8px 22px rgba(24,29,45,.10)
  }
  body.nopic .piclessRow{display:flex}
  body.nopic .wordRow{margin-top:0}
  body.nopic .word{font-size:clamp(40px,12.5vw,68px);line-height:1.06}
  body.nopic .koWord{margin-top:8px;font-size:16px}
  body.nopic .sents{margin-top:14px;gap:10px}
  body.nopic .sent{font-size:clamp(18px,5.3vw,24px)}
  body.nopic .sentKo{font-size:14.5px}
  /* ---------- quiz ---------- */
  #quizView{display:none}
  body.quizmode .stage{display:none}
  body.quizmode #quizView{
    display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:24px;padding:16px 14px 18px;
    box-shadow:0 8px 22px rgba(24,29,45,.10)
  }
  .quizTop{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:#7b8194;letter-spacing:.02em}
  .quizTop .qScore{color:#8a6100}
  .qPicWrap{position:relative;width:100%;height:clamp(140px,23vh,205px);border-radius:16px;overflow:hidden;background:#f4f5f8}
  .qPicWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  body.nopic .qPicWrap{display:none}
  .qSent{margin:2px 0 0;text-align:center;font-size:clamp(19px,5.4vw,25px);font-weight:800;line-height:1.55;color:#232838;word-break:keep-all}
  .blank{color:#c2c7d4;letter-spacing:.04em}
  .fill{color:#1f2430;background:linear-gradient(180deg,transparent 46%,#ffe27a 46%,#ffe27a 94%,transparent 94%);border-radius:3px;padding:0 2px}
  .qSentKo{margin:-2px 0 0;text-align:center;font-size:13.5px;font-weight:600;color:#8b90a0;line-height:1.45;word-break:keep-all}
  .qChoices{display:grid;gap:8px;margin-top:2px}
  .qChoice{
    border:1.8px solid #e6e8f0;background:#fff;border-radius:15px;padding:13px 10px;font:inherit;
    font-size:clamp(17px,4.6vw,21px);font-weight:800;color:#2a3040;cursor:pointer;line-height:1.2;
    transition:background .15s,border-color .15s,color .15s,transform .1s
  }
  .qChoice:active{transform:scale(.98)}
  .qChoice.right{background:#e9f9ee;border-color:#5cc98a;color:#1c7a45}
  .qChoice.wrong{background:#fdecec;border-color:#f3a8a8;color:#b03a3a;opacity:.72}
  .qChoice[disabled]{cursor:default}
  .qFeed{min-height:18px;margin:0;text-align:center;font-size:13px;font-weight:800;color:#1c7a45}
  .qFeed.bad{color:#c4534f}
  .qNext{display:block;width:100%;border:0;border-radius:15px;background:#f59e0b;color:#fff;font:inherit;font-size:16px;font-weight:800;padding:13px;cursor:pointer}
  .qNext:active{transform:scale(.98)}
  .qResult{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 6px;text-align:center}
  .qStars{font-size:clamp(30px,9vw,44px);font-weight:900;color:#1f2430;letter-spacing:-.02em}
  .qMsg{margin:0;font-size:14.5px;font-weight:800;color:#6b7086}
  .qBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
  .qBtn{border-radius:15px;font:inherit;font-size:14.5px;font-weight:800;padding:13px 8px;cursor:pointer;border:1.8px solid #e6e8f0;background:#fff;color:#4b5163}
  .qBtn.solid{background:#1f2430;border-color:#1f2430;color:#fff}
  .qBtn:active{transform:scale(.98)}
  @media (min-width:600px){
    .qChoices{grid-template-columns:1fr 1fr 1fr}
  }
  /* ---------- sentences ---------- */
  .sents{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .sent{margin:0;text-align:center;font-size:clamp(16px,4.5vw,19px);font-weight:700;color:#2a3040;line-height:1.5;word-break:keep-all}
  .sent mark{background:linear-gradient(180deg,transparent 46%,#ffe27a 46%,#ffe27a 94%,transparent 94%);
    color:inherit;padding:0 2px;border-radius:2px;font-weight:900}
  .sentKo{margin:-2px 0 0;text-align:center;font-size:13.5px;font-weight:600;color:#8b90a0;line-height:1.45;word-break:keep-all}
  /* ---------- actions ---------- */
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
  .act{
    border:1.5px solid #e6e8f0;background:#fff;border-radius:14px;padding:11px 4px;font:inherit;font-size:11.5px;font-weight:800;
    color:#4b5163;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;line-height:1.25;
    transition:transform .1s ease,border-color .15s,background .15s
  }
  .act:active{transform:scale(.96)}
  .act .em{font-size:17px;line-height:1}
  .act.on{background:#fff4dc;border-color:#f6c56b;color:#8a6100}
  .act.playing{border-color:#f59e0b;background:#fffaf0}
  /* ---------- toast / banner ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#242a38;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:88vw;text-align:center;z-index:60
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .banner{
    position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.94);
    background:#1f2430;color:#fff;padding:14px 22px;border-radius:18px;font-size:15.5px;font-weight:800;
    box-shadow:0 14px 34px rgba(20,24,40,.34);opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;z-index:70;max-width:86vw;text-align:center
  }
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  footer{text-align:center;font-size:11px;color:#a2a7b6;padding:12px 0 4px;font-weight:600}
  @media (min-width:600px){
    .photoBox{aspect-ratio:4/3}
  }
  @media (min-width:520px){
    .actions{gap:9px}
    .act{font-size:12.5px;padding:13px 6px}
    .act .em{font-size:19px}
  }
  @media (max-height:680px){
    .photoBox{aspect-ratio:16/10}
    .sents{gap:5px}
  }
  @media (max-height:760px){
    header{padding:calc(8px + env(safe-area-inset-top)) 4px 6px}
    .logo{width:34px;height:34px;font-size:18px;border-radius:10px}
    header h1{font-size:16.5px}
    .modes{padding:3px;margin-bottom:8px}
    .mode{padding:7px 6px;font-size:12.5px}
    .days{padding-bottom:8px}
    .day{padding:6px 9px}
    .toolbar{padding-bottom:8px}
    .chip{padding:7px 11px}
    .photoBox{aspect-ratio:1/0.93}
    .qPicWrap{height:clamp(130px,20vh,190px)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">📸</div>
    <div>
      <h1>실사 영단어 슬라이드</h1>
      <p>하루 10개 · 사진으로 배우는 영어 단어</p>
    </div>
  </header>

  <div class="modes" role="tablist" aria-label="화면 선택">
    <button class="mode on" id="modeCard" type="button" role="tab" aria-selected="true"><span aria-hidden="true">📸</span><span>단어 카드</span></button>
    <button class="mode" id="modeQuiz" type="button" role="tab" aria-selected="false"><span aria-hidden="true">🎯</span><span>문장 퀴즈</span></button>
  </div>

  <nav class="days" id="dayTabs" aria-label="Day 선택"></nav>

  <div class="toolbar" role="group" aria-label="보기 설정">
    <button class="chip" id="picBtn" type="button" aria-pressed="false"><span aria-hidden="true">🖼️</span><span>그림 숨기기</span></button>
    <button class="chip" id="shuffleBtn" type="button" aria-pressed="false"><span aria-hidden="true">🔀</span><span>순서 섞기</span></button>
    <button class="chip" id="koBtn" type="button" aria-pressed="false"><span aria-hidden="true">가</span><span>한글 뜻</span></button>
  </div>

  <main>
    <section class="stage" aria-label="단어 슬라이드">
      <div class="photoBox" id="photoBox">
        <div class="bg" id="photoBg" aria-hidden="true"></div>
        <img id="photo" alt="" draggable="false">
        <div class="count" id="count">1 / 10</div>
        <button class="nav prev" id="prevBtn" type="button" aria-label="이전 단어">◀</button>
        <button class="nav next" id="nextBtn" type="button" aria-label="다음 단어">▶</button>
      </div>
      <div class="dots" id="dots" role="tablist" aria-label="단어 위치"></div>

      <div class="practice" id="practice">
        <div class="piclessRow" id="piclessRow">
          <button class="navBtn" id="prevBtn2" type="button" aria-label="이전 단어">◀</button>
          <span class="count2" id="count2">1 / 10</span>
          <button class="navBtn" id="nextBtn2" type="button" aria-label="다음 단어">▶</button>
        </div>

        <div class="wordRow">
          <h2 class="word" id="word">apple</h2>
        </div>
        <p class="koWord" id="koWord" hidden>사과</p>

        <div class="sents" id="sents"></div>
      </div>

      <div class="actions">
        <button class="act" id="btnWord" type="button"><span class="em">🔊</span><span>단어 듣기</span></button>
        <button class="act" id="btnSent" type="button"><span class="em">🔊</span><span>문장 읽기</span></button>
        <button class="act" id="btnSlow" type="button"><span class="em">🐢</span><span>천천히</span></button>
        <button class="act" id="btnAuto" type="button"><span class="em">▶</span><span>자동 넘김</span></button>
      </div>
    </section>

    <footer id="foot">사진을 옆으로 밀어도 넘어가요 · 사진을 누르면 단어를 읽어 줘요</footer>

    <section class="quiz" id="quizView" aria-label="문장 퀴즈">
      <div class="quizTop">
        <span class="qCount" id="qCount">1 / 10</span>
        <span class="qScore" id="qScore">⭐ 0</span>
      </div>
      <div class="quizPlay" id="quizPlay">
        <div class="qPicWrap"><img id="qPic" alt="" draggable="false"></div>
        <p class="qSent" id="qSent"></p>
        <p class="qSentKo" id="qSentKo" hidden></p>
        <div class="qChoices" id="qChoices" role="group" aria-label="보기"></div>
        <p class="qFeed" id="qFeed" aria-live="polite"></p>
        <button class="qNext" id="qNext" type="button" hidden>다음 문제 ▶</button>
      </div>
      <div class="qResult" id="qResult" hidden>
        <div class="qStars" id="qStars">⭐ 8 / 10</div>
        <p class="qMsg" id="qMsg">잘했어요!</p>
        <div class="qBtns">
          <button class="qBtn" id="qRetry" type="button">다시 풀기</button>
          <button class="qBtn solid" id="qBack" type="button">단어 카드</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="banner" id="banner" role="status" aria-live="polite"></div>

<script>

  var DAYS = [1,2,3,4,5];
  var EMMA_PITCH = 1.4, EMMA_RATE = 1.02, EMMA_SLOW = 0.6;
  var STORE_KEY = "wordSlidesDaily:v1";

  var S = { day: 1, idx: 0, ko: false, pic: true, shuffle: false, orders: {}, done: {}, viewed: {}, quiz: false, quizBest: {} };

  function $(id){ return document.getElementById(id); }
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      var o = JSON.parse(raw);
      if(o && typeof o === "object"){
        if(o.done && typeof o.done === "object") S.done = o.done;
        if(o.viewed && typeof o.viewed === "object") S.viewed = o.viewed;
        if(typeof o.day === "number" && o.day >= 1 && o.day <= 5) S.day = o.day;
        if(typeof o.ko === "boolean") S.ko = o.ko;
        if(typeof o.pic === "boolean") S.pic = o.pic;
        if(typeof o.shuffle === "boolean") S.shuffle = o.shuffle;
        if(o.orders && typeof o.orders === "object"){
          for(var k in o.orders){
            var arr = o.orders[k];
            if(Object.prototype.hasOwnProperty.call(o.orders, k) && Array.isArray(arr) &&
               arr.length === 10 && arr.every(function(v){ return typeof v === "number"; })){
              S.orders[k] = arr;
            }
          }
        }
        if(typeof o.quiz === "boolean") S.quiz = o.quiz;
        if(o.quizBest && typeof o.quizBest === "object"){
          for(var qb in o.quizBest){
            var rec = o.quizBest[qb];
            if(Object.prototype.hasOwnProperty.call(o.quizBest, qb) && rec && typeof rec.score === "number") S.quizBest[qb] = rec;
          }
        }
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify({ done: S.done, day: S.day, ko: S.ko, viewed: S.viewed,
                                                          pic: S.pic, shuffle: S.shuffle, orders: S.orders,
                                                          quiz: S.quiz, quizBest: S.quizBest })); }catch(e){}
  }

  function baseList(){ return DATA.filter(function(w){ return w.day === S.day; }); }
  function list(){
    var b = baseList(), ord = S.orders[S.day];
    if(S.shuffle && ord && ord.length === b.length){
      return ord.map(function(i){ return b[i]; });
    }
    return b;
  }
  function cur(){ return list()[S.idx]; }

  /* ---------------- shuffle ---------------- */
  function shuffledOrder(day){
    var n = DATA.filter(function(w){ return w.day === day; }).length;
    var natural = [], i;
    for(i=0;i<n;i++) natural.push(i);
    var prev = S.orders[day];
    for(var tries=0; tries<40; tries++){
      var a = natural.slice();
      for(i=n-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      var identity = a.every(function(v,k){ return v === k; });
      var samePrev = prev && prev.length === n && a.every(function(v,k){ return v === prev[k]; });
      if(!identity && !samePrev) return a;
    }
    return natural.slice().reverse();
  }

  /* ---------------- speech (Emma tone) ---------------- */
  var synth = window.speechSynthesis || null;
  var speechOK = !!synth && typeof window.SpeechSynthesisUtterance === "function";
  var voices = [], toastT = null, bannerT = null, seq = 0;

  function toast(msg){
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("show"); }, 2300);
  }
  function banner(msg){
    var el = $("banner"); el.textContent = msg; el.classList.add("show");
    clearTimeout(bannerT); bannerT = setTimeout(function(){ el.classList.remove("show"); }, 2800);
  }
  function refreshVoices(){ if(!speechOK) return; try{ voices = synth.getVoices() || []; }catch(e){ voices = []; } }
  refreshVoices();
  if(speechOK && typeof synth.addEventListener === "function") synth.addEventListener("voiceschanged", refreshVoices);

  function pickVoice(){
    if(!voices.length) refreshVoices();
    if(!voices.length) return null;
    var pref = [/google us english/i, /samantha/i, /aria/i, /jenny/i, /ava/i, /zira/i, /michelle/i, /female/i];
    for(var p=0;p<pref.length;p++){
      for(var v=0;v<voices.length;v++){
        if(/^en[-_]/i.test(voices[v].lang) && pref[p].test(voices[v].name)) return voices[v];
      }
    }
    for(var u=0;u<voices.length;u++) if(/^en[-_]US/i.test(voices[u].lang)) return voices[u];
    for(var k=0;k<voices.length;k++) if(/^en/i.test(voices[k].lang)) return voices[k];
    return null;
  }

  function flash(id, on){
    var b = $(id); if(!b) return;
    b.classList.toggle("playing", !!on);
  }

  function speak(text, slow, btnId){
    return new Promise(function(resolve){
      if(!speechOK){ toast("이 브라우저에서는 소리가 나오지 않아요"); resolve(false); return; }
      var mine = ++seq;
      try{ synth.cancel(); }catch(e){}
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.pitch = EMMA_PITCH; u.rate = slow ? EMMA_SLOW : EMMA_RATE;
      var v = pickVoice(); if(v) u.voice = v;
      var finished = false, timer = null;
      function finish(ok){
        if(finished) return; finished = true;
        clearTimeout(timer); if(btnId) flash(btnId,false);
        resolve(ok && mine === seq ? true : (mine === seq));
      }
      u.onend = function(){ finish(true); };
      u.onerror = function(){ finish(true); };
      var words = text.split(/\s+/).length;
      var guess = (700 + words * 330) / (slow ? 0.62 : 1.0) + 900;
      timer = setTimeout(function(){ finish(true); }, Math.max(1600, Math.min(guess, 20000)));
      if(btnId) flash(btnId,true);
      try{ synth.speak(u); }catch(e){ finish(true); }
    });
  }

  function stopAll(){
    autoOn = false; seq++;
    if(speechOK){ try{ synth.cancel(); }catch(e){} }
    ["btnWord","btnSent","btnSlow"].forEach(function(id){ flash(id,false); });
    $("btnAuto").classList.remove("on");
    $("btnAuto").innerHTML = '<span class="em">▶</span><span>자동 넘김</span>';
  }

  /* ---------------- render ---------------- */
  function highlight(text, word){
    var safe = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("\\b(" + safe + ")\\b", "gi");
    return text.replace(re, "<mark>$1</mark>");
  }

  function renderDayTabs(){
    var html = "";
    for(var i=0;i<DAYS.length;i++){
      var d = DAYS[i];
      var marks = (S.done[d] ? "⭐" : "") + (S.quizBest[d] ? "🎯" : "");
      html += '<button type="button" class="day' + (d===S.day?" on":"") + (S.done[d]?" done":"") + '" data-day="' + d + '"' +
              (d===S.day?' aria-current="true"':'') + '>' +
              '<span>Day ' + d + '</span>' +
              (marks ? '<span class="st" aria-label="진행 기록">' + marks + '</span>' : '<span class="st">&nbsp;</span>') +
              '</button>';
    }
    $("dayTabs").innerHTML = html;
    var on = $("dayTabs").querySelector(".day.on");
    if(on && on.scrollIntoView){ try{ on.scrollIntoView({block:"nearest",inline:"center"}); }catch(e){} }
  }

  function renderDots(){
    var n = list().length, html = "";
    for(var i=0;i<n;i++){
      html += '<button type="button" class="dot' + (i===S.idx?" on":"") + '" data-i="' + i + '"' +
              ' aria-label="' + (i+1) + '번째 단어"' + (i===S.idx?' aria-current="true"':'') + '></button>';
    }
    $("dots").innerHTML = html;
  }

  function render(){
    var items = list(), it = items[S.idx];
    if(!it) return;
    var img = $("photo");
    img.src = it.img;
    img.alt = it.word + " 사진";
    $("photoBg").style.backgroundImage = 'url("' + it.img + '")';
    // restart the swap animation
    img.style.animation = "none"; void img.offsetWidth; img.style.animation = "";
    $("count").textContent = (S.idx+1) + " / " + items.length;
    $("count2").textContent = (S.idx+1) + " / " + items.length;
    $("word").textContent = it.word;
    $("koWord").textContent = it.ko;
    $("koWord").hidden = !S.ko;
    $("koBtn").classList.toggle("on", S.ko);
    $("koBtn").setAttribute("aria-pressed", S.ko ? "true" : "false");

    var html = "";
    for(var i=0;i<it.sentences.length;i++){
      var s = it.sentences[i];
      html += '<p class="sent">' + highlight(s.en, it.word) + '</p>';
      if(S.ko) html += '<p class="sentKo">' + s.ko + '</p>';
    }
    $("sents").innerHTML = html;

    $("prevBtn").disabled = (S.idx === 0);
    $("nextBtn").disabled = (S.idx === items.length - 1);
    $("prevBtn2").disabled = (S.idx === 0);
    $("nextBtn2").disabled = (S.idx === items.length - 1);

    // picture show / hide
    document.body.classList.toggle("nopic", !S.pic);
    var pb = $("picBtn");
    pb.classList.toggle("on", !S.pic);
    pb.setAttribute("aria-pressed", S.pic ? "false" : "true");
    pb.innerHTML = S.pic
      ? '<span aria-hidden="true">🖼️</span><span>그림 숨기기</span>'
      : '<span aria-hidden="true">🙈</span><span>그림 보기</span>';

    // shuffle toggle
    var sb = $("shuffleBtn");
    sb.classList.toggle("on", S.shuffle);
    sb.setAttribute("aria-pressed", S.shuffle ? "true" : "false");
    sb.innerHTML = S.shuffle
      ? '<span aria-hidden="true">🔀</span><span>랜덤 ON</span>'
      : '<span aria-hidden="true">🔀</span><span>순서 섞기</span>';

    renderDots();
    renderDayTabs();
    paintMode();
    if(S.quiz && Q) renderQuiz();
  }

  function paintMode(){
    document.body.classList.toggle("quizmode", !!S.quiz);
    $("modeCard").classList.toggle("on", !S.quiz);
    $("modeCard").setAttribute("aria-selected", S.quiz ? "false" : "true");
    $("modeQuiz").classList.toggle("on", !!S.quiz);
    $("modeQuiz").setAttribute("aria-selected", S.quiz ? "true" : "false");
    $("foot").textContent = S.quiz
      ? "빈칸에 들어갈 단어를 골라 보세요"
      : (S.pic
          ? "사진을 옆으로 밀어도 넘어가요 · 사진을 누르면 단어를 읽어 줘요"
          : "글자만 보고 읽어 봐요 · ◀ ▶ 로 넘겨요");
  }

  function markViewed(){
    S.viewed[S.day] = S.viewed[S.day] || {};
    S.viewed[S.day][S.idx] = 1;
    save();
    var seen = Object.keys(S.viewed[S.day]).length;
    if(seen >= 10 && !S.done[S.day]){
      S.done[S.day] = true; save();
      banner("Day " + S.day + " 완료! ⭐");
      renderDayTabs();
    }
  }

  function go(i, opts){
    var items = list();
    if(i < 0 || i >= items.length) return;
    stopAll();
    S.idx = i;
    render();
    markViewed();
    if(!opts || !opts.silent){
      if(autoOn) return;
    }
  }

  function goDay(d){
    stopAll();
    S.day = d; S.idx = 0; save();
    S.viewed[d] = S.viewed[d] || {};
    if(S.shuffle && (!S.orders[d] || S.orders[d].length !== baseList().length)) S.orders[d] = shuffledOrder(d);
    save();
    if(S.quiz){ Q = null; startQuiz(); } else render();
    markViewed();
    if(S.done[d]) toast("Day " + d + "는 이미 완료했어요 ⭐");
  }

  /* ---------------- auto play ---------------- */
  var autoOn = false;
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function runAuto(){
    while(autoOn){
      var it = cur();
      if(!it) break;
      await speak(it.word, false, "btnWord");
      if(!autoOn) break;
      await wait(1500);
      if(!autoOn) break;
      await speak(it.sentences.map(function(s){ return s.en; }).join(" "), false, "btnSent");
      if(!autoOn) break;
      await wait(1300);
      if(!autoOn) break;
      var items = list();
      if(S.idx < items.length - 1){
        S.idx++;
        render();
        markViewed();
        await wait(260);
      }else{
        markViewed();
        stopAll();
        banner("Day " + S.day + " 끝! ⭐");
        break;
      }
    }
  }

  function toggleAuto(){
    if(autoOn){ stopAll(); return; }
    if(!speechOK){ toast("이 브라우저에서는 소리가 나오지 않아요"); return; }
    autoOn = true;
    $("btnAuto").classList.add("on");
    $("btnAuto").innerHTML = '<span class="em">⏸</span><span>멈추기</span>';
    runAuto();
  }

  /* ---------------- sentence quiz ---------------- */
  var Q = null;

  function esc(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function wordRe(word){
    var safe = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp("\\b(" + safe + ")\\b", "i");
  }
  function pickSentence(it, k){
    var hits = [], i;
    for(i=0;i<it.sentences.length;i++){ if(wordRe(it.word).test(it.sentences[i].en)) hits.push(i); }
    if(!hits.length) return -1;
    return hits[k % hits.length];
  }
  function shuffled(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function makeChoices(it){
    var pool = [], seen = {};
    baseList().forEach(function(w){
      if(w.word !== it.word && !seen[w.word]){ seen[w.word] = 1; pool.push(w.word); }
    });
    var picks = [it.word].concat(shuffled(pool).slice(0, 2));
    return shuffled(picks);
  }

  function startQuiz(){
    var items = list();
    Q = {
      i: 0, score: 0, done: false, cur: null,
      qs: items.map(function(it, k){ return { it: it, si: pickSentence(it, k) }; })
    };
    showQuestion();
  }

  function showQuestion(){
    if(!Q || !Q.qs.length) return;
    var q = Q.qs[Q.i];
    Q.cur = { opts: makeChoices(q.it), answered: false, wrong: [] };
    render();
  }

  function renderQuiz(){
    var q = Q.qs[Q.i];
    if(!q || !Q.cur) return;
    var it = q.it, s = q.si >= 0 ? it.sentences[q.si] : { en: "Look at the " + it.word + ".", ko: it.ko }, total = Q.qs.length;
    $("qCount").textContent = (Q.i + 1) + " / " + total;
    $("qScore").textContent = "⭐ " + Q.score;

    $("qPic").src = it.img;
    $("qPic").alt = "";
    $("qSentKo").textContent = s.ko;
    $("qSentKo").hidden = !S.ko;

    var shown = esc(s.en);
    $("qSent").innerHTML = Q.cur.answered
      ? shown.replace(wordRe(it.word), '<span class="fill">' + esc(it.word) + '</span>')
      : shown.replace(wordRe(it.word), '<span class="blank">______</span>');

    var html = "", i, w, cls;
    for(i=0;i<Q.cur.opts.length;i++){
      w = Q.cur.opts[i]; cls = "qChoice";
      if(Q.cur.answered && w === it.word) cls += " right";
      if(Q.cur.wrong.indexOf(w) >= 0) cls += " wrong";
      html += '<button type="button" class="' + cls + '" data-w="' + esc(w) + '"' +
              (Q.cur.wrong.indexOf(w) >= 0 ? " disabled" : "") +
              ' aria-label="보기 ' + (i+1) + ': ' + esc(w) + '">' + esc(w) + '</button>';
    }
    $("qChoices").innerHTML = html;

    var feed = $("qFeed");
    if(Q.cur.answered){ feed.textContent = "정답이에요! 문장을 들어 보세요"; feed.className = "qFeed"; }
    else if(Q.cur.wrong.length){ feed.textContent = "다시 한 번 골라 봐요"; feed.className = "qFeed bad"; }
    else { feed.textContent = ""; feed.className = "qFeed"; }

    var nb = $("qNext");
    nb.hidden = !Q.cur.answered;
    nb.textContent = (Q.i >= total - 1) ? "결과 보기 ⭐" : "다음 문제 ▶";

    $("quizPlay").hidden = !!Q.done;
    $("qResult").hidden = !Q.done;
    if(Q.done){
      $("qStars").textContent = "⭐ " + Q.score + " / " + total;
      $("qMsg").textContent = Q.score === total ? "완벽해요! 🎉"
        : (Q.score >= 7 ? "참 잘했어요!" : (Q.score >= 4 ? "좋아요! 한 번 더 해 봐요" : "다시 한 번 해 볼까요?"));
    }
  }

  function finishQuiz(){
    stopAll();
    Q.done = true;
    var best = S.quizBest[S.day];
    if(!best || Q.score > best.score) S.quizBest[S.day] = { score: Q.score, total: Q.qs.length };
    save();
    render();
    banner("Day " + S.day + " 퀴즈 ⭐ " + Q.score + " / " + Q.qs.length);
  }

  function setMode(on){
    if(S.quiz === on) return;
    stopAll();
    S.quiz = on; save();
    Q = null;
    if(on){ startQuiz(); toast("문장 퀴즈! 빈칸에 알맞은 단어를 골라요"); }
    else render();
  }

  /* ---------------- events ---------------- */
  $("dayTabs").addEventListener("click", function(e){
    var b = e.target.closest(".day");
    if(!b) return;
    goDay(parseInt(b.getAttribute("data-day"), 10));
  });

  $("dots").addEventListener("click", function(e){
    var b = e.target.closest(".dot");
    if(!b) return;
    go(parseInt(b.getAttribute("data-i"), 10), null);
  });

  $("prevBtn").addEventListener("click", function(){ if(S.idx>0) go(S.idx-1, null); });
  $("nextBtn").addEventListener("click", function(){ if(S.idx<list().length-1) go(S.idx+1, null); });
  $("prevBtn2").addEventListener("click", function(){ if(S.idx>0) go(S.idx-1, null); });
  $("nextBtn2").addEventListener("click", function(){ if(S.idx<list().length-1) go(S.idx+1, null); });

  $("picBtn").addEventListener("click", function(){
    S.pic = !S.pic; save(); render();
    toast(S.pic ? "사진을 다시 보여 줘요" : "사진을 숨겼어요 — 글자만 보고 읽어 봐요");
  });

  $("shuffleBtn").addEventListener("click", function(){
    stopAll();
    S.shuffle = !S.shuffle;
    if(S.shuffle){
      S.orders[S.day] = shuffledOrder(S.day);
      toast("순서를 섞었어요! 1번부터 다시 봐요");
    }else{
      delete S.orders[S.day];
      toast("원래 순서로 돌아왔어요");
    }
    S.idx = 0; save();
    if(S.quiz){ Q = null; startQuiz(); }
    else { render(); markViewed(); }
  });

  $("btnWord").addEventListener("click", function(){
    stopAll(); speak(cur().word, false, "btnWord");
  });
  $("btnSent").addEventListener("click", function(){
    stopAll();
    speak(cur().sentences.map(function(s){ return s.en; }).join(" "), false, "btnSent");
  });
  $("btnSlow").addEventListener("click", function(){
    stopAll();
    var it = cur();
    (async function(){
      await speak(it.word, true, "btnSlow");
      await wait(650);
      await speak(it.sentences.map(function(s){ return s.en; }).join(" "), true, "btnSlow");
    })();
  });
  $("btnAuto").addEventListener("click", toggleAuto);

  $("koBtn").addEventListener("click", function(){
    S.ko = !S.ko; save(); render();
  });

  $("modeCard").addEventListener("click", function(){ setMode(false); });
  $("modeQuiz").addEventListener("click", function(){ setMode(true); });

  $("qChoices").addEventListener("click", function(e){
    if(!Q || Q.done || !Q.cur || Q.cur.answered) return;
    var b = e.target.closest(".qChoice");
    if(!b || b.disabled) return;
    var w = b.getAttribute("data-w"), q = Q.qs[Q.i];
    if(w === q.it.word){
      Q.cur.answered = true;
      Q.score++;
      render();
      var s = q.si >= 0 ? q.it.sentences[q.si] : { en: "Look at the " + q.it.word + "." };
      speak(s.en, false, null);
    }else{
      if(Q.cur.wrong.indexOf(w) < 0) Q.cur.wrong.push(w);
      render();
    }
  });

  $("qNext").addEventListener("click", function(){
    if(!Q) return;
    if(Q.i < Q.qs.length - 1){ Q.i++; showQuestion(); }
    else finishQuiz();
  });

  $("qRetry").addEventListener("click", function(){
    if(!S.quiz){ setMode(true); return; }
    stopAll(); Q = null; startQuiz();
  });

  $("qBack").addEventListener("click", function(){ setMode(false); });

  // tap on the photo reads the word
  $("photo").addEventListener("click", function(){
    stopAll(); speak(cur().word, false, "btnWord");
  });

  // swipe
  (function(){
    var x0 = null, y0 = null, moved = false, box = $("photoBox");
    box.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
    }, {passive:true});
    box.addEventListener("touchmove", function(e){
      if(x0 === null || e.touches.length !== 1) return;
      var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) moved = true;
    }, {passive:true});
    box.addEventListener("touchend", function(e){
      if(x0 === null) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = null; y0 = null;
      if(Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy)) return;
      if(dx < 0 && S.idx < list().length-1) go(S.idx+1, null);
      else if(dx > 0 && S.idx > 0) go(S.idx-1, null);
    }, {passive:true});
  })();

  // keyboard
  document.addEventListener("keydown", function(e){
    if(S.quiz){
      if(e.key === "Enter" && Q && Q.cur && Q.cur.answered && !$("qNext").hidden) $("qNext").click();
      return;
    }
    if(e.key === "ArrowRight" && S.idx < list().length-1) go(S.idx+1, null);
    else if(e.key === "ArrowLeft" && S.idx > 0) go(S.idx-1, null);
    else if(e.key === " "){ e.preventDefault(); toggleAuto(); }
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stopAll();
  });
  window.addEventListener("pagehide", stopAll);

  /* ---------------- boot ---------------- */
  load();
  S.viewed[S.day] = S.viewed[S.day] || {};
  if(S.quiz) startQuiz();
  else { render(); markViewed(); }
  if(!speechOK) toast("이 브라우저는 읽어 주기를 지원하지 않아요");
})();
</script>
</body>
</html>
