  :root{
    --cream:#fff8f0;
    --paper:#ffffff;
    --ink:#342a3a;
    --ink2:#7a6b7d;
    --line:#f2e3d5;
    --red:#ef5b4c;
    --red-d:#d2453a;
    --red-s:#ffe8e4;
    --teal:#1fa899;
    --teal-d:#15897d;
    --teal-s:#dff6f2;
    --sun:#ffb703;
    --sun-s:#fff3d1;
    --violet:#7c5cff;
    --green:#28a86b;
    --green-s:#e2f7ec;
    --shadow:0 8px 22px rgba(96,62,40,.09);
    --shadow-l:0 14px 34px rgba(96,62,40,.13);
    --r:26px;
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overflow-x:hidden}
  html,body{margin:0;padding:0}
  body{
    font-family:'WordPlay',"Trebuchet MS","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(90vw 60vw at 8% -8%, #ffe6d6 0%, rgba(255,230,214,0) 62%),
      radial-gradient(80vw 55vw at 104% 4%, #dff4f0 0%, rgba(223,244,240,0) 60%),
      linear-gradient(180deg,#fffaf4 0%, #fff6ec 52%, #fffaf6 100%);
    background-attachment:fixed;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    padding:0 0 calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}
  button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  button:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
  h1,h2,h3,p{margin:0}
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:10px 14px 0;overflow-x:clip}
  .screen{width:100%}

  /* ---------------- header ---------------- */
  header.top{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:6px 0 12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
  .brand .mark{
    flex:0 0 auto;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
    font-size:24px;line-height:1;background:#fff;box-shadow:var(--shadow);
    border:2px solid #fff;
  }
  .brand h1{
    font-size:clamp(19px,5.2vw,25px);line-height:1.05;letter-spacing:0;
    white-space:nowrap;
  }
  body.playing header.top{display:none}
  .brand p{
    margin-top:3px;font-size:11.5px;font-weight:700;color:var(--ink2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;
  }
  .tools{display:flex;align-items:center;gap:7px;margin-left:auto;flex:0 0 auto}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    min-height:40px;padding:7px 12px;border-radius:999px;
    background:#fff;border:2px solid var(--line);
    font-size:13px;font-weight:800;color:var(--ink2);
    box-shadow:0 3px 8px rgba(96,62,40,.06);
    transition:transform .12s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .pill:active{transform:translateY(1px) scale(.985)}
  .pill.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .pill.stars{color:var(--ink);background:#fff9e8;border-color:#ffe6a8;font-variant-numeric:tabular-nums}
  .pill.stars b{font-size:15px;color:#b07800}
  .star{color:#ffb703;font-style:normal;line-height:1;text-shadow:0 1px 0 rgba(190,120,0,.18)}
  .pill.ghost{background:transparent;box-shadow:none}

  /* ---------------- home ---------------- */
  .homelead{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
  .homelead strong{font-size:clamp(16px,4.4vw,19px);letter-spacing:-.2px}
  .homelead span{font-size:12px;font-weight:700;color:var(--ink2)}

  .bookrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  .book{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:10px 6px 9px;border-radius:20px;background:#fff;
    border:2.5px solid var(--line);box-shadow:0 4px 12px rgba(96,62,40,.06);
    text-align:center;min-width:0;
    transition:transform .14s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
  }
  .book .bemoji{font-size:23px;line-height:1.1}
  .book .btitle{
    font-size:clamp(10.5px,2.9vw,12.5px);font-weight:800;line-height:1.16;letter-spacing:-.1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.32em;
  }
  .book .bmeta{font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .book[aria-pressed="true"]{
    border-color:var(--red);background:linear-gradient(180deg,#fff 0%,#fff3ef 100%);
    box-shadow:0 8px 20px rgba(239,91,76,.18);transform:translateY(-1px);
  }
  .book[data-book="B"][aria-pressed="true"]{
    border-color:var(--teal);background:linear-gradient(180deg,#fff 0%,#effbf9 100%);
    box-shadow:0 8px 20px rgba(31,168,153,.18);
  }
  .book[data-book="All"][aria-pressed="true"]{
    border-color:var(--violet);background:linear-gradient(180deg,#fff 0%,#f2efff 100%);
    box-shadow:0 8px 20px rgba(124,92,255,.18);
  }
  .book[aria-pressed="true"] .bmeta{color:var(--ink)}

  .sect{
    display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;
    color:var(--ink2);margin:0 0 8px 4px;
  }
  .sect span.k{font-size:11.5px;font-weight:800;letter-spacing:0;text-transform:none;color:#a08f9c}

  .gamerow{display:grid;gap:10px;margin-bottom:16px}
  .game{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 14px;border-radius:24px;background:#fff;
    border:2.5px solid var(--line);box-shadow:var(--shadow);
    text-align:left;min-width:0;
    transition:transform .14s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .game:active{transform:scale(.99)}
  .game .gicon{
    flex:0 0 auto;width:56px;height:56px;border-radius:19px;
    display:grid;place-items:center;font-size:27px;line-height:1;
    background:var(--red-s);
  }
  .game[data-game="build"] .gicon{background:var(--sun-s)}
  .game[data-game="sentence"] .gicon{background:var(--green-s)}
  .game .gtext{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
  .game .gt{font-size:clamp(16px,4.4vw,18px);font-weight:900;letter-spacing:-.3px;line-height:1.2}
  .game .ge{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--red)}
  .game[data-game="build"] .ge{color:#b07800}
  .game[data-game="sentence"] .ge{color:var(--green)}
  .game .gd{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.35;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .game .garrow{flex:0 0 auto;font-size:24px;font-weight:700;color:#d9c9c0;padding-right:2px}

  /* sight-word look (chips + badges) */
  .game[data-game="sight"]{
    border-color:#e3daff;
    background:linear-gradient(180deg,#fff 0%,#faf7ff 100%);
  }
  .game[data-game="sight"] .gicon{background:linear-gradient(180deg,#f3efff,#e6dcff)}
  .game[data-game="sight"] .ge{color:var(--violet)}
  .sighttag{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10px;font-weight:900;letter-spacing:.9px;color:#6f57cf;
    background:#f2edff;border-radius:999px;padding:4px 11px;
  }
  .ccard.sight{
    justify-content:center;gap:7px;min-height:clamp(112px,15vh,146px);
    background:linear-gradient(180deg,#fff 0%,#f7f3ff 100%);border-color:#e4dbff;
  }
  .ccard.sight .ccword{
    font-size:clamp(22px,6.4vw,30px);color:#5b43c9;letter-spacing:.2px;margin-top:0;
    word-break:normal;overflow-wrap:anywhere;
  }
  .ccard.sight .stag{
    display:inline-block;font-size:9px;font-weight:900;letter-spacing:.9px;
    color:#8a76d8;background:#fff;border:1.5px solid #e8e0ff;border-radius:999px;padding:2px 8px;
  }
  .ccard.sight.ok{background:var(--green-s);border-color:var(--green)}
  .ccard.sight.ok .ccword{color:#1c7d4f}
  .ccard.sight.dim{opacity:.4}
  .sightcard{
    display:grid;place-items:center;width:clamp(100px,26vw,120px);height:clamp(100px,26vw,120px);
    border-radius:30px;background:linear-gradient(180deg,#fff,#f4efff);
    border:2.5px solid #e2d9ff;box-shadow:var(--shadow);
  }
  .sightcard .spk{font-size:clamp(34px,9vw,42px);line-height:1}
  .sightcard:active{transform:scale(.97)}

  .stripwrap{position:relative;margin:0 -2px 4px}
  .stripwrap::after{
    content:"";position:absolute;top:0;right:0;bottom:10px;width:26px;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,248,240,0),rgba(255,248,240,.95));
  }
  .strip{
    display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;
    padding:2px 14px 10px 2px;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .wcard{
    flex:0 0 auto;width:92px;scroll-snap-align:start;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:8px 6px 9px;border-radius:20px;background:#fff;
    border:2px solid var(--line);box-shadow:0 4px 10px rgba(96,62,40,.06);
  }
  .wcard:active{transform:scale(.97)}
  .wcard .art{width:52px;height:52px}
  .wcard .w{font-size:12px;font-weight:900;letter-spacing:-.1px;line-height:1.15;text-align:center;word-break:break-word}
  .wcard .wk{font-size:10px;font-weight:700;color:var(--ink2);line-height:1.1}
  .strip.sight{padding-bottom:8px;gap:7px}
  .schip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:999px;background:#fff;
    border:2px solid var(--line);box-shadow:0 3px 8px rgba(96,62,40,.05);
    font-size:15px;font-weight:800;letter-spacing:.2px;
  }
  .schip:active{background:#fff7ec}

  .note{
    font-size:11.5px;line-height:1.5;color:#9b8b99;font-weight:600;
    padding:2px 4px 10px;
  }

  /* ---------------- play ---------------- */
  .playtop{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
  .iconbtn{
    flex:0 0 auto;width:44px;height:44px;border-radius:15px;background:#fff;
    box-shadow:var(--shadow);border:2px solid #fff;
    display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink2);
  }
  .iconbtn:active{transform:scale(.96)}
  .playmid{flex:1 1 auto;min-width:0}
  .ptitle{font-size:15px;font-weight:900;letter-spacing:-.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .psub{
    font-size:10.5px;font-weight:800;color:var(--ink2);letter-spacing:.2px;
    margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dots{display:flex;gap:4px;margin-top:7px;flex-wrap:nowrap;overflow:hidden}
  .dot{height:6px;border-radius:4px;background:#f1e1d5;flex:1 1 0;min-width:0}
  .dot.now{background:var(--sun)}
  .dot.done{background:var(--green)}

  .stage{display:flex;flex-direction:column;padding-bottom:6px;flex:1 1 auto;min-height:40vh}
  .stageinner{margin:0 auto;width:100%}
  .stageinner.center{margin:auto 0}
  #play.screen{display:flex;flex-direction:column;min-height:calc(100dvh - 26px)}
  .playfoot{
    position:sticky;bottom:calc(6px + env(safe-area-inset-bottom));
    margin-top:8px;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
    padding:9px 10px;border-radius:999px;
    background:rgba(255,255,255,.84);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:2px solid #fff;box-shadow:0 8px 20px rgba(96,62,40,.10);
    z-index:5;
  }
  .playfoot .pill{min-height:42px;font-size:12.5px;padding:6px 13px;background:#fff}
  .playfoot .pill.on{background:var(--teal);border-color:var(--teal);color:#fff}

  /* prompt */
  .prompt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 12px;text-align:center}
  .speaker{
    position:relative;width:clamp(96px,26vw,116px);height:clamp(96px,26vw,116px);
    border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 34% 30%, #ff9f92 0%, var(--red) 62%, var(--red-d) 100%);
    box-shadow:0 10px 24px rgba(239,91,76,.32), inset 0 -4px 0 rgba(0,0,0,.08);
    color:#fff;
  }
  .speaker:active{transform:scale(.97)}
  .speaker svg{width:46%;height:46%;display:block}
  .speaker .rings{position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(239,91,76,.35);animation:ring 2.2s ease-out infinite}
  .speaker .rings:nth-child(2){animation-delay:1.1s}
  @keyframes ring{0%{transform:scale(.94);opacity:.7}70%{transform:scale(1.22);opacity:0}100%{opacity:0}}
  .ptext{font-size:clamp(17px,4.6vw,20px);font-weight:900;letter-spacing:-.3px}
  .pko{font-size:12px;font-weight:700;color:var(--ink2)}
  .warn{
    font-size:11.5px;font-weight:700;color:#b07800;background:var(--sun-s);
    border-radius:12px;padding:5px 10px;margin-top:2px;
  }
  .linkbtn{
    font-size:11.5px;font-weight:800;color:#a3929f;padding:4px 10px;
    text-decoration:underline;text-underline-offset:3px;border-radius:999px;
  }
  .linkbtn:active{background:#fff5e9}

  /* listen choices */
  .choices{display:grid;gap:10px}
  .choices.listen{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccard{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:10px 6px 11px;border-radius:24px;background:#fff;
    border:2.5px solid var(--line);box-shadow:0 6px 16px rgba(96,62,40,.07);
    min-width:0;min-height:clamp(140px,20vh,186px);
    transition:transform .14s ease,border-color .18s,background .18s,opacity .3s,box-shadow .18s;
  }
  .ccard .art{width:clamp(62px,17vw,92px);height:auto;display:block}
  .ccard .ccword{
    font-size:clamp(14px,4.1vw,17px);font-weight:900;letter-spacing:-.1px;
    line-height:1.15;text-align:center;word-break:break-word;margin-top:2px;
  }
  .ccard .ccko{font-size:10.5px;font-weight:700;color:var(--ink2);line-height:1.1}
  .ccard:active{transform:scale(.98)}
  .ccard.ok{border-color:var(--green);background:var(--green-s);box-shadow:0 8px 22px rgba(40,168,107,.22)}
  .ccard.ok::after{
    content:"★";position:absolute;top:5px;right:9px;color:var(--sun);font-size:19px;
    animation:pop .4s cubic-bezier(.2,1.6,.5,1);
  }
  .ccard.no{animation:shake .42s ease;border-color:#f3b4ab;background:#fff4f2}
  .ccard.dim{opacity:.42}
  @keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px) rotate(-1.5deg)}42%{transform:translateX(6px) rotate(1.2deg)}66%{transform:translateX(-4px)}84%{transform:translateX(3px)}}

  /* word builder */
  .artbox{
    display:grid;place-items:center;width:clamp(124px,34vw,158px);height:clamp(124px,34vw,158px);
    border-radius:50%;background:#fff;box-shadow:var(--shadow);border:2px solid #fff;
  }
  .artbox .art{width:82%;height:82%}
  .slotstrip{max-width:430px;margin:8px auto 6px;padding:9px 9px 9px;border:2px dashed #e8cdb6;border-radius:20px;background:#fff8ee}
  .slots{display:flex;gap:6px;justify-content:center;width:100%;margin:0}
  .slot{
    flex:1 1 0;min-width:0;max-width:46px;height:clamp(44px,12vw,56px);
    display:grid;place-items:center;border-radius:12px;background:#fff;
    border:2px solid #f0ddcc;
    font-size:clamp(17px,5.2vw,24px);font-weight:900;text-transform:lowercase;
    color:var(--ink);transition:background .15s,border-color .15s,transform .15s;
  }
  .slot.filled{background:#f3efff;border-color:var(--violet);box-shadow:inset 0 -3px 0 rgba(124,92,255,.14);color:#5b43c9;animation:pop .26s cubic-bezier(.2,1.6,.5,1)}
  .slots.shake{animation:shake .45s ease}
  .slots.good .slot{background:var(--green-s);border-color:var(--green);color:#1c7d4f;box-shadow:none}
  .hintword{
    font-size:13px;font-weight:900;letter-spacing:1px;color:var(--violet);
    background:#f2efff;border-radius:999px;padding:4px 14px;margin:2px auto 0;width:max-content;
    animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  .tiles{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;margin:12px auto 4px;max-width:430px}
  .tile{
    flex:1 1 0;min-width:0;max-width:52px;height:clamp(44px,12vw,56px);
    display:grid;place-items:center;border-radius:14px;
    background:linear-gradient(180deg,#fff 0%,#fff6ea 100%);
    border:2.5px solid #ecd9c6;border-bottom:4px solid #e0c9b3;
    font-size:clamp(19px,5.6vw,24px);font-weight:900;text-transform:lowercase;
    box-shadow:0 3px 8px rgba(96,62,40,.07);
    transition:transform .1s,opacity .18s,background .18s;
  }
  .tile:active{transform:translateY(2px) scale(.97)}
  .tile.used{opacity:.26;pointer-events:none;transform:translateY(2px)}
  .tile.ok{background:var(--green-s);border-color:var(--green);border-bottom-color:#9fd9b9}
  .tile.no{animation:shake .4s ease;border-color:#f3b4ab}
  .buildctl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .buildctl .pill{min-height:46px;font-size:13px;padding:6px 15px;background:#fff}

  /* sentence */
  .scard{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    background:#fff;border-radius:28px;border:2.5px solid var(--line);
    box-shadow:var(--shadow);padding:18px 14px 20px;text-align:center;margin-bottom:14px;
  }
  .scard .sart{width:clamp(72px,20vw,94px);height:auto;display:block}
  .sart .art{width:100%;height:auto}
  .sent{
    font-size:clamp(24px,6.8vw,34px);font-weight:900;line-height:1.5;letter-spacing:-.5px;
    word-break:break-word;
  }
  .blank{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:2.3em;padding:0 .3em;margin:0 .1em;
    border-radius:13px;border:2.5px dashed #e6c8b2;background:#fff8ef;
    color:#c9a68f;font-size:.82em;vertical-align:baseline;
    transition:background .2s,border-color .2s,color .2s,transform .2s;
  }
  .blank.filled{border-style:solid;border-color:var(--green);background:var(--green-s);color:var(--green);animation:pop .35s cubic-bezier(.2,1.6,.5,1)}
  .blank.no{animation:shake .4s ease;border-color:#f3b4ab}
  .choices.opts{grid-template-columns:1fr;gap:9px;max-width:430px;margin:0 auto}
  .opt{
    min-height:60px;padding:10px 16px;border-radius:20px;background:#fff;
    border:2.5px solid var(--line);border-bottom-width:4px;
    font-size:clamp(19px,5.2vw,23px);font-weight:900;letter-spacing:-.2px;
    box-shadow:0 5px 14px rgba(96,62,40,.06);
    transition:transform .12s,border-color .18s,background .18s,opacity .2s;
  }
  .opt:active{transform:translateY(2px) scale(.99)}
  .opt.ok{background:var(--green-s);border-color:var(--green)}
  .opt.no{animation:shake .42s ease;border-color:#f3b4ab;background:#fff4f2;opacity:.6;pointer-events:none}

  /* finish overlay */
  .overlay{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(52,42,58,.42);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    animation:fadein .2s ease;
  }
  .fcard{
    width:100%;max-width:400px;max-height:86vh;overflow-y:auto;
    background:#fff;border-radius:30px;padding:22px 18px 18px;text-align:center;
    box-shadow:0 22px 50px rgba(40,20,10,.3);
    animation:rise .32s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes rise{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .fstars{display:flex;justify-content:center;gap:4px;line-height:1}
  .fstars .st{font-size:clamp(34px,10vw,46px);color:#efe0cf;transform:scale(.86);transition:color .2s}
  .fstars .st.on{color:#ffb703;animation:pop .45s cubic-bezier(.2,1.6,.5,1) both}
  .fstars .st.on:nth-child(2){animation-delay:.14s}
  .fstars .st.on:nth-child(3){animation-delay:.28s}
  .fcard h2{font-size:clamp(22px,6.4vw,28px);letter-spacing:-.5px;margin-top:6px}
  .fsub{font-size:13.5px;font-weight:800;color:var(--ink2);margin-top:4px}
  .fwords{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px}
  .fword{
    display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 6px;border-radius:999px;
    background:#fff8ef;border:2px solid #f6e6d6;font-size:12px;font-weight:800;
  }
  .fword .art{width:22px;height:22px}
  .fbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
  .btn{
    min-height:52px;border-radius:18px;font-size:15px;font-weight:900;
    background:#fff;border:2.5px solid var(--line);color:var(--ink);
    display:grid;place-items:center;
  }
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 18px rgba(239,91,76,.28)}
  .btn:active{transform:scale(.985)}

  /* toast + burst */
  #toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(12px);
    z-index:60;padding:9px 18px;border-radius:999px;
    background:rgba(52,42,58,.92);color:#fff;font-size:14px;font-weight:900;letter-spacing:-.2px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;
    box-shadow:0 10px 24px rgba(40,20,10,.25);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .burst{position:fixed;z-index:55;pointer-events:none;font-size:22px;color:#ffb703;text-shadow:0 2px 0 rgba(190,120,0,.18);animation:burst .9s ease-out forwards}
  @keyframes burst{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rot));opacity:0}}

  /* ---------------- responsive ---------------- */
  @media (min-width:560px){
    .choices.listen{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:620px;margin:0 auto}
    .ccard{min-height:clamp(168px,22vh,210px)}
    .ccard .art{width:clamp(70px,10vw,104px)}
    .speaker{width:clamp(104px,15vh,136px);height:clamp(104px,15vh,136px)}
    .artbox{width:clamp(130px,20vh,172px);height:clamp(130px,20vh,172px)}
    .choices.opts{grid-template-columns:repeat(3,minmax(0,1fr));max-width:680px;margin:0 auto;gap:12px}
    .opt{min-height:70px}
    .scard{padding:20px 18px 22px;gap:12px}
    .scard .sart{width:clamp(84px,12vh,116px)}
    .sent{font-size:clamp(26px,3.4vw,36px)}
    .tiles{gap:10px}
    .tile{max-width:58px;height:clamp(50px,5.4vw,62px)}
  }
  @media (min-width:680px){
    .wrap{padding:14px 20px 0}
    .gamerow{grid-template-columns:1fr;gap:12px}

    .pill{padding:7px 10px;font-size:12px}

<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark">🎈</div>
      <div>
        <h1>Word Play</h1>
        <p id="brandSub">Two books · four games</p>
      </div>
    </div>
    <div class="tools">
      <button class="pill" id="koBtn" type="button" aria-pressed="false">한글 뜻</button>
      <div class="pill stars" aria-label="모은 별"><span class="star">★</span><b id="starTotal">0</b></div>
    </div>
  </header>

  <!-- ============ HOME ============ -->
  <section class="screen" id="home">
    <div class="homelead">
      <strong>Pick a book!</strong>
      <span>책을 고르고 놀이를 시작해요</span>
    </div>

    <div class="bookrow" id="bookRow" role="group" aria-label="책 선택">
      <button class="book" data-book="A" type="button" aria-pressed="true">
        <span class="bemoji">🍎</span>
        <span class="btitle">What Is Red?</span>
        <span class="bmeta">8 words · <span class="star">★</span> <b data-stars="A">0</b></span>
      </button>
      <button class="book" data-book="B" type="button" aria-pressed="false">
        <span class="bemoji">🧸</span>
        <span class="btitle">The Jumble Sale</span>
        <span class="bmeta">10 words · <span class="star">★</span> <b data-stars="B">0</b></span>
      </button>
      <button class="book" data-book="All" type="button" aria-pressed="false">
        <span class="bemoji">🌟</span>
        <span class="btitle">두 책 모두</span>
        <span class="bmeta">18 words · <span class="star">★</span> <b data-stars="All">0</b></span>
      </button>
    </div>

    <h2 class="sect">Games <span class="k">놀이 4가지</span></h2>
    <div class="gamerow" id="gameRow">
      <button class="game" data-game="sight" type="button">
        <span class="gicon">🌟</span>
        <span class="gtext">
          <span class="gt">사이트워드 집중</span>
          <span class="ge">Sight Word Pop</span>
          <span class="gd">듣고 고르기 · 문장 빈칸 · 철자 맞추기를 한 판 12문제로</span>
        </span>
        <span class="garrow">›</span>
      </button>
      <button class="game" data-game="listen" type="button">
        <span class="gicon">🔊</span>
        <span class="gtext">
          <span class="gt">듣고 찾기</span>
          <span class="ge">Listen &amp; Catch</span>
          <span class="gd">원어민 발음을 듣고 알맞은 그림 카드를 골라요</span>
        </span>
        <span class="garrow">›</span>
      </button>
      <button class="game" data-game="build" type="button">
        <span class="gicon">🔤</span>
        <span class="gtext">
          <span class="gt">알파벳 블록</span>
          <span class="ge">Word Builder</span>
          <span class="gd">그림을 보고 글자 블록을 순서대로 눌러 단어를 완성해요</span>
        </span>
        <span class="garrow">›</span>
      </button>
      <button class="game" data-game="sentence" type="button">
        <span class="gicon">📖</span>
        <span class="gtext">
          <span class="gt">문장 빈칸</span>
          <span class="ge">Sentence Pop</span>
          <span class="gd">책 속 문장의 빈칸에 알맞은 영어 단어를 넣어요</span>
        </span>
        <span class="garrow">›</span>
      </button>
    </div>

    <h2 class="sect">Word Cards <span class="k">눌러서 들어 보세요</span></h2>
    <div class="stripwrap"><div class="strip" id="strip"></div></div>
    <h2 class="sect">Sight Words <span class="k">책 속 사이트워드</span></h2>
    <div class="stripwrap"><div class="strip sight" id="sightStrip"></div></div>

    <p class="note" id="homeNote">🌟 사이트워드 집중은 한 판에 12문제(듣고 고르기 4 · 문장 빈칸 4 · 철자 맞추기 4)예요. 소리가 나지 않으면 폰의 미디어 음량을 올려 주세요. 🔊 버튼을 눌러도 다시 들을 수 있어요.</p>
  </section>

  <!-- ============ PLAY ============ -->
  <section class="screen" id="play" hidden>
    <div class="playtop">
      <button class="iconbtn" id="backBtn" type="button" aria-label="뒤로 가기">←</button>
      <div class="playmid">
        <div class="ptitle" id="playTitle">Listen &amp; Catch</div>
        <div class="psub" id="playSub">What Is Red?</div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="pill stars" aria-label="이번 판 별"><span class="star">★</span><b id="roundStars">0</b></div>
    </div>

    <div class="stage" id="stage"></div>

    <div class="playfoot">
      <button class="pill" id="slowBtn" type="button" aria-pressed="false">🐢 천천히</button>
      <button class="pill" id="repeatBtn" type="button">🔊 다시 듣기</button>
      <button class="pill" id="koBtn2" type="button" aria-pressed="false">한글 뜻</button>
    </div>
  </section>
</div>

<!-- ============ FINISH ============ -->
<div class="overlay" id="finish" hidden>
  <div class="fcard">
    <div class="fstars" id="fStars"><span class="st">★</span><span class="st">★</span><span class="st">★</span></div>
    <h2 id="fTitle">You did it!</h2>
    <p class="fsub" id="fSub"></p>
    <div class="fwords" id="fWords"></div>
    <div class="fbtns">
      <button class="btn primary" id="againBtn" type="button">한 번 더</button>
      <button class="btn" id="homeBtn" type="button">다른 놀이</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

  var TTS = {
    supported: (typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined'),
    voice: null,
    /* 목소리 톤 — 해율 스터디보드와 같은 밝고 또렷한 영어 톤 */
    tone: { pitch: 1.4, rate: 1.02, slow: 0.6 },
    isIOS: function(){
      try {
        var ua = navigator.userAgent || '';
        if (/iPad|iPhone|iPod/.test(ua)) return true;
        return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      } catch (e) { return false; }
    },
    /* 발음 보정 — 사이트워드 'a'는 알파벳 이름('에이')이 아니라 약한 '어' 소리로 읽어요.
       화면에는 그대로 'a'가 보이고, 한 단어만 읽을 때만 바꿔요(문장 읽기는 그대로). */
    sayAs: { 'a': 'uh' },
    said: function(text){
      var t = String(text == null ? '' : text).trim();
      return this.sayAs[t.toLowerCase()] || t;
    },
    init: function(){
      if (!this.supported) return;
      var self = this;
      var load = function(){
        var vs = [];
        try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
        function score(v){
          var s = 0;
          var lang = v.lang || '';
          if (/^en[-_]US/i.test(lang)) s += 4; else if (/^en[-_]/i.test(lang)) s += 1;
          if (v.localService) s += 3;   /* 기기 안 목소리 — 태블릿·폰에서 실제로 소리가 나는 쪽 */
          if (/samantha|google|zira|aria|jenny|natural|karen|moira|daniel/i.test(v.name || '')) s += 1;
          return s;
        }
        var ens = vs.filter(function(v){ return /^en[-_]/i.test(v.lang || ''); });
        ens.sort(function(a, b){ return score(b) - score(a); });
        self.voice = ens[0] || null;
        if (self.isIOS()) {
          var loc = ens.filter(function(v){ return v.localService; });
          if (loc.length) self.voice = loc[0];
        }
      };
      load();
      if (window.speechSynthesis.addEventListener) {
        window.speechSynthesis.addEventListener('voiceschanged', load);
      } else {
        window.speechSynthesis.onvoiceschanged = load;
      }
      setTimeout(load, 400);
    },
    rate: function(){ return DB.slow ? this.tone.slow : this.tone.rate; },
    say: function(text, rate){
      if (!this.supported || !text) return;
      var said = this.said(text);
      if (!said) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(said);
        u.lang = 'en-US';
        u.rate = rate || this.rate();
        u.pitch = this.tone.pitch;
        u.volume = 1;
        if (!this.voice) this.init();
        try { if (this.voice) u.voice = this.voice; } catch (e) {}
        window.speechSynthesis.speak(u);
      } catch (e) {}
    },
    sayParts: function(parts, rate){
      if (!this.supported) return;
      try {
        window.speechSynthesis.cancel();
        var self = this;
        parts.forEach(function(txt){
          if (!txt || !String(txt).trim()) return;
          var u = new SpeechSynthesisUtterance(self.said(txt));
          u.lang = 'en-US';
          u.rate = rate || self.rate();
          u.pitch = self.tone.pitch;
          u.volume = 1;
          try { if (self.voice) u.voice = self.voice; } catch (e) {}
          window.speechSynthesis.speak(u);
        });
      } catch (e) {}
    },
    stop: function(){
      if (!this.supported) return;
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }

    $('#koBtn').classList.toggle('on', DB.ko);
    var k2 = $('#koBtn2');
    if (k2) {
      k2.setAttribute('aria-pressed', DB.ko ? 'true' : 'false');
      k2.classList.toggle('on', DB.ko);
    }
    $$('.ccko, .wk').forEach(function(el){ el.hidden = !DB.ko; });
  }

  function renderStrip(){
    var strip = $('#strip');
    var sight = $('#sightStrip');
    var books = S.book === 'All' ? ['A', 'B'] : [S.book];
    var html = '';
    var shtml = '';
    books.forEach(function(b){
      BOOKS[b].words.forEach(function(w){
        html += '<button class="wcard" type="button" data-w="' + esc(w.w) + '">' +
          svgArt(w.art) +
          '<span class="w">' + esc(w.w) + '</span>' +
          '<span class="wk"' + (DB.ko ? '' : ' hidden') + '>' + esc(w.ko) + '</span>' +
        '</button>';
      });
      siteFor(b).forEach(function(s){
        shtml += '<button class="schip" type="button" data-w="' + esc(s.w) + '">' + esc(s.w) + '</button>';
      });
    });
    strip.innerHTML = html;
    if (sight) sight.innerHTML = shtml;
    $$('.wcard', strip).forEach(function(btn){
      btn.addEventListener('click', function(){
        sfxTap();
        TTS.say(btn.getAttribute('data-w'));
        btn.style.transform = 'scale(.95)';
        setTimeout(function(){ btn.style.transform = ''; }, 130);
      });
    });
    if (sight) {
      $$('.schip', sight).forEach(function(btn){
        btn.addEventListener('click', function(){
          sfxTap();
          TTS.say(btn.getAttribute('data-w'));
        });
      });
    }
  }

  function setBook(id){
    S.book = id;
    $$('.book').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-book') === id ? 'true' : 'false');
    });
    renderStrip();
    applyKo();
    var sub = id === 'All' ? 'What Is Red? + The Jumble Sale' : BOOKS[id].title;
    $('#brandSub').textContent = 'Two books · four games';
    $('#playSub').textContent = sub;
  }

  function showHome(){
    clearTimers();
    TTS.stop();
    S.screen = 'home';
    S.game = null;
    document.body.classList.remove('playing');
    $('#play').hidden = true;
    $('#finish').hidden = true;
    $('#home').hidden = false;
    updateStars();
    applyKo();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* =========================================================
     ROUND DATA
     ========================================================= */
  function booksSel(){
    return S.book === 'All' ? ['A', 'B'] : [S.book];
  }

  function siteFor(b){
    return SIGHT.filter(function(s){ return s.book === b; });
  }

  function sightWordsAll(){
    var out = [];
    booksSel().forEach(function(b){
      siteFor(b).forEach(function(s){
        out.push({ w: s.w, ko: s.ko, book: b, sight: true });
      });
    });
    return out;
  }

  function koFor(word){
    if (!word) return '';
    var w0 = String(word).toLowerCase(), ko = '';
    SIGHT.some(function(s){
      if (s.w === w0) { ko = s.ko; return true; }
      return false;
    });
    if (ko) return ko;
    booksSel().some(function(b){
      BOOKS[b].words.forEach(function(w){ if (w.w.toLowerCase() === w0) ko = w.ko; });
      return !!ko;
    });
    return ko;
  }

  /* pool for the original three games — core words AND sight words */
  function poolFor(game){
    var out = [];
    booksSel().forEach(function(b){
      if (game === 'sentence') {
        BOOKS[b].sentences.forEach(function(s, idx){
          out.push({
            kind: 'sentence', book: b, text: s.text, answer: s.answer,
            opts: s.opts.slice(), art: s.art || null, sid: b + '-' + idx, sw: !!s.sw
          });
        });
        return;
      }
      BOOKS[b].words.forEach(function(w, idx){
        if (game === 'build' && (w.w.indexOf(' ') >= 0 || w.w.length > 7)) return;
        out.push({ kind: game, book: b, w: w.w, ko: w.ko, art: w.art, wid: b + '-' + idx });
      });
      siteFor(b).forEach(function(s, idx){
        if (game === 'build' && (s.w.length < 2 || s.w.length > 4)) return;
        out.push({ kind: game, book: b, w: s.w, ko: s.ko, art: null, sight: true, wid: b + '-sw-' + idx });
      });
    });
    return out;
  }

  /* Sight Word Pop — 4 listen + 4 sentence + 4 spell, shuffled */
  function sightMix(){
    var ML = [], MB = [], MS = [];
    booksSel().forEach(function(b){
      siteFor(b).forEach(function(s, idx){
        ML.push({ kind: 'listen', book: b, w: s.w, ko: s.ko, art: null, sight: true, wid: b + '-sw-' + idx });
        if (s.w.length >= 2 && s.w.length <= 4) {
          MB.push({ kind: 'build', book: b, w: s.w, ko: s.ko, art: null, sight: true, wid: b + '-swb-' + idx });
        }
      });
      BOOKS[b].sentences.forEach(function(s, idx){
        if (!s.sw) return;
        MS.push({
          kind: 'sentence', book: b, text: s.text, answer: s.answer,
          opts: s.opts.slice(), art: s.art || null, sid: b + '-' + idx, sw: true
        });
      });
    });
    return shuffle([].concat(sample(ML, 4), sample(MB, 4), sample(MS, 4)));
  }

  function startGame(game){
    S.game = game;
    S.roundStars = 0;
    S.solved = 0;
    S.perfect = 0;
    S.answered = false;
    S.locked = false;
    S.i = 0;
    if (game === 'sight') {
      S.qs = sightMix();
    } else {
      var pool = poolFor(game);
      S.qs = sample(pool, Math.min(GAMES[game].n, pool.length));
    }
    if (!S.qs.length) { showHome(); return; }
    S.screen = 'play';
    document.body.classList.add('playing');
    $('#home').hidden = true;
    $('#finish').hidden = true;
    $('#play').hidden = false;
    $('#playTitle').textContent = GAMES[game].title;
    $('#playSub').textContent = (S.book === 'All' ? '두 책 모두' : BOOKS[S.book].title) + ' · ' + GAMES[game].en;
    $('#repeatBtn').textContent = game === 'sentence' ? '🔊 문장 듣기' : '🔊 다시 듣기';
    $('#roundStars').textContent = '0';
    renderDots();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function renderDots(){
    var n = S.qs.length;
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<span class="dot' + (i < S.i ? ' done' : (i === S.i ? ' now' : '')) + '"></span>';
    }
    $('#dots').innerHTML = html;
  }

  /* =========================================================
     RENDER: questions
     ========================================================= */
  function renderQuestion(){
    S.answered = false;
    S.locked = false;
    S.qFirstTry = true;
    S.hintUsed = false;
    renderDots();
    var q = S.qs[S.i];
    if (!q) { finishRound(); return; }
    var kind = q.kind || S.game;
    if (kind === 'listen') renderListen(q);
    else if (kind === 'build') renderBuild(q);
    else renderSentence(q);
  }

  function koHint(target){
    if (!DB.ko) return '';
    var ko = koFor(target);
    return ko ? '<p class="pko">' + esc(ko) + '</p>' : '';
  }

  /* ---------- 1) Listen & Catch ---------- */
  function renderListen(q){
    var others;
    if (q.sight) {
      others = sample(sightWordsAll().filter(function(s){ return s.w !== q.w; }), 3);
    } else {
      others = sample(BOOKS[q.book].words.filter(function(w){ return w.w !== q.w; }), 3);
    }
    var cards = shuffle([q].concat(others));
    S.target = q.w;

    var html = '' +
      '<div class="prompt">' +
        '<button class="speaker" id="speakerBtn" type="button" aria-label="단어 듣기">' +
          '<span class="rings"></span><span class="rings"></span>' +
          '<svg viewBox="0 0 48 48" aria-hidden="true">' +
            '<path d="M7 19h7l10-8v26l-10-8H7z" fill="#fff"/>' +
            '<path d="M30 16.5c3.5 2.5 3.5 12.5 0 15M36 11c6.5 5.5 6.5 20.5 0 26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>' +
          '</svg>' +
        '</button>' +
        '<p class="ptext">' + (q.sight ? 'Listen and tap the word!' : 'Listen and tap!') + '</p>' +
        (q.sight ? '<span class="sighttag">🌟 SIGHT WORD</span>' : '') +
        '<p class="pko">' + (q.sight ? '잘 듣고 알맞은 단어를 눌러요' : '잘 듣고 알맞은 그림을 눌러요') + '</p>' +
        (!TTS.supported ? '<p class="warn">이 기기에서는 소리가 나지 않아요. 단어를 보고 골라 보세요.</p>' : '') +
        (!TTS.supported ? '<p class="ptext" style="font-size:26px;color:#ef5b4c">' + esc(q.w) + '</p>' : '') +
        '<button class="linkbtn" id="listenHint" type="button">💡 단어 보기</button>' +
        '<div id="hintLine"></div>' +
      '</div>' +
      '<div class="choices listen' + (q.sight ? ' sightgrid' : '') + '" id="choices">' +
        cards.map(function(w){
          if (w.sight) {
            return '<button class="ccard sight" type="button" data-key="' + esc(w.w) + '" aria-label="' + esc(w.w) + '">' +
              '<span class="ccword">' + esc(w.w) + '</span>' +
              '<span class="stag">SIGHT WORD</span>' +
              '<span class="ccko"' + (DB.ko ? '' : ' hidden') + '>' + esc(w.ko || '') + '</span>' +
            '</button>';
          }
          return '<button class="ccard" type="button" data-key="' + esc(w.w) + '" aria-label="' + esc(w.w) + '">' +
            '<span class="ccart">' + svgArt(w.art) + '</span>' +
            '<span class="ccword">' + esc(w.w) + '</span>' +
            '<span class="ccko"' + (DB.ko ? '' : ' hidden') + '>' + esc(w.ko) + '</span>' +
          '</button>';
        }).join('') +
      '</div>';

    $('#stage').innerHTML = '<div class="stageinner">' + html + '</div>';

    $('#speakerBtn').addEventListener('click', function(){ sfxTap(); TTS.say(q.w); });
    $('#listenHint').addEventListener('click', function(){
      sfxTap();
      TTS.say(q.w);
      var line = $('#hintLine');
      if (line) {
        line.innerHTML = '<div class="hintword">' + esc(q.w) + '</div>';
        later(function(){ if (line) line.innerHTML = ''; }, 3000);
      }
    });
    $$('#choices .ccard').forEach(function(btn){
      btn.addEventListener('click', function(){ onListenPick(btn, q); });
    });

    later(function(){ TTS.say(q.w); }, 380);
  }

  function onListenPick(btn, q){
    if (S.locked || S.answered) return;
    var key = btn.getAttribute('data-key');
    if (key === q.w) {
      S.answered = true;
      S.locked = true;
      btn.classList.add('ok');
      $$('#choices .ccard').forEach(function(b){ if (b !== btn) b.classList.add('dim'); });
      onCorrect(btn, q.w);
      later(nextQuestion, 1450);
    } else {
      if (S.qFirstTry) S.qFirstTry = false;
      btn.classList.remove('no');
      void btn.offsetWidth;
      btn.classList.add('no');
      sfxBad();
      toast('Try again 🙂');
      later(function(){ btn.classList.remove('no'); }, 520);
    }
  }

  /* ---------- 2) Word Builder ---------- */
  function renderBuild(q){
    S.target = q.w;
    var letters = q.w.split('');
    var tiles = shuffle(letters.map(function(ch, i){ return { ch: ch, id: i, used: false }; }));
    if (tiles.map(function(t){ return t.ch; }).join('') === q.w && letters.length > 1) {
      tiles = shuffle(tiles);
    }
    S.tiles = tiles;
    S.built = [];

    var html = '' +
      '<div class="prompt">' +
        (q.sight
          ? '<button class="sightcard" id="sightSpk" type="button" aria-label="단어 듣기"><span class="spk">🔊</span></button>'
          : '<div class="artbox">' + svgArt(q.art) + '</div>') +
        '<p class="ptext">' + (q.sight ? 'Spell the word you hear!' : 'Build the word!') + '</p>' +
        (q.sight ? '<span class="sighttag">🌟 SIGHT WORD</span>' : '') +
        '<p class="pko">' + (q.sight ? '소리를 듣고 글자를 순서대로 눌러요' : '그림을 보고 글자를 순서대로 눌러요') + '</p>' +
        (q.sight && !TTS.supported ? '<p class="warn">이 기기에서는 소리가 나지 않아요. 💡 힌트로 단어를 확인해요.</p>' : '') +
        koHint(q.w) +
      '</div>' +
      '<div class="slotstrip"><div class="slots" id="slots"></div></div>' +
      '<div class="hintslot" id="hintSlot"></div>' +
      '<div class="tiles" id="tiles"></div>' +
      '<div class="buildctl">' +
        '<button class="pill" id="undoBtn" type="button">⌫ 한 글자 지우기</button>' +
        '<button class="pill" id="hintBtn" type="button">💡 힌트</button>' +
      '</div>';

    $('#stage').innerHTML = '<div class="stageinner center">' + html + '</div>';

    if ($('#sightSpk')) {
      $('#sightSpk').addEventListener('click', function(){ sfxTap(); TTS.say(q.w); });
    }
    $('#tiles').addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('.tile') : null;
      if (!btn) return;
      onTile(btn);
    });
    $('#undoBtn').addEventListener('click', undoLetter);
    $('#hintBtn').addEventListener('click', showHint);

    paintBuild();
    later(function(){ TTS.say(q.w); }, 380);
  }

  function paintBuild(q){
    q = q || S.qs[S.i];
    var slots = $('#slots'), tilesEl = $('#tiles');
    if (!slots || !tilesEl) return;
    var len = q.w.length;

    var sh = '';
    for (var i = 0; i < len; i++) {
      var b = S.built[i];
      sh += '<span class="slot' + (b ? ' filled' : '') + '" data-slot="' + i + '">' + (b ? esc(b.ch) : '') + '</span>';
    }
    slots.innerHTML = sh;

    tilesEl.innerHTML = S.tiles.map(function(t, idx){
      var used = S.built.some(function(b){ return b.tid === idx; });
      return '<button class="tile' + (used ? ' used' : '') + '" type="button" data-tid="' + idx + '" aria-label="' + esc(t.ch) + '">' + esc(t.ch) + '</button>';
    }).join('');
  }

  function onTile(btn){
    if (S.locked || S.answered) return;
    var q = S.qs[S.i];
    var tid = Number(btn.getAttribute('data-tid'));
    if (!q || S.built.length >= q.w.length) return;
    if (S.built.some(function(b){ return b.tid === tid; })) return;
    sfxTap();
    S.built.push({ tid: tid, ch: S.tiles[tid].ch });
    paintBuild(q);
    if (S.built.length === q.w.length) later(function(){ checkBuild(q); }, 180);
  }

  function undoLetter(){
    if (S.locked || S.answered) return;
    if (!S.built.length) { sfxTap(); return; }
    S.built.pop();
    sfxTap();
    paintBuild();
  }

  function showHint(){
    if (S.answered) return;
    var q = S.qs[S.i];
    S.hintUsed = true;
    sfxTap();
    TTS.say(q.w);
    var box = $('#hintSlot');
    if (box) {
      box.innerHTML = '<div class="hintword">' + esc(q.w) + '</div>';
      later(function(){ if (box) box.innerHTML = ''; }, 2800);
    }
  }

  function checkBuild(q){
    if (S.answered) return;
    var guess = S.built.map(function(b){ return b.ch; }).join('');
    var slots = $('#slots');
    if (guess === q.w) {
      S.answered = true;
      S.locked = true;
      if (slots) slots.classList.add('good');
      $$('#tiles .tile').forEach(function(t){ t.classList.add('used'); });
      onCorrect(null, q.w);
      later(nextQuestion, 1600);
    } else {
      if (S.qFirstTry) S.qFirstTry = false;
      sfxBad();
      if (slots) {
        slots.classList.add('shake');
        later(function(){ if (slots) slots.classList.remove('shake'); }, 460);
      }
      toast('Try again 🙂');
      later(function(){
        S.built = [];
        paintBuild(q);
      }, 620);
    }
  }

  /* ---------- 3) Sentence Pop ---------- */
  function renderSentence(q){
    S.target = q.answer;
    var parts = q.text.split('{b}');
    var pre = parts[0] || '';
    var post = parts[1] || '';
    var opts = shuffle(q.opts);

    var html = '' +
      '<div class="scard">' +
        (q.art ? '<span class="sart">' + svgArt(q.art) + '</span>' : '') +
        '<p class="sent">' + esc(pre) + '<span class="blank" id="blank">?</span>' + esc(post) + '</p>' +
        (q.sw ? '<span class="sighttag">🌟 SIGHT WORD</span>' : '') +
      '</div>' +
      '<div class="choices opts" id="opts">' +
        opts.map(function(o, idx){
          return '<button class="opt" type="button" data-idx="' + idx + '">' + esc(o) + '</button>';
        }).join('') +
      '</div>';

    $('#stage').innerHTML = '<div class="stageinner">' + html + '</div>';

    $$('#opts .opt').forEach(function(btn){
      btn.addEventListener('click', function(){
        var val = opts[Number(btn.getAttribute('data-idx'))];
        onPickOption(btn, val, q, pre, post);
      });
    });

    later(function(){ TTS.sayParts([pre, post]); }, 420);
  }

  function onPickOption(btn, val, q, pre, post){
    if (S.answered || S.locked) return;
    if (val === q.answer) {
      S.answered = true;
      S.locked = true;
      btn.classList.add('ok');
      $$('#opts .opt').forEach(function(b){ if (b !== btn) b.style.opacity = '.45'; });
      var blank = $('#blank');
      if (blank) {
        blank.textContent = q.answer;
        blank.classList.add('filled');
      }
      S.target = q.answer;
      onCorrect(btn, null);
      TTS.sayParts([pre, q.answer + '\u00a0' + post], null);
      later(nextQuestion, 1900);
    } else {
      if (S.qFirstTry) S.qFirstTry = false;
      btn.classList.add('no');
      sfxBad();
      toast('Try again 🙂');
      var blank2 = $('#blank');
      if (blank2) {
        blank2.classList.remove('no');
        void blank2.offsetWidth;
        blank2.classList.add('no');
        later(function(){ blank2.classList.remove('no'); }, 480);
      }
    }
  }

  /* =========================================================
     CORRECT / NEXT / FINISH
     ========================================================= */
  function onCorrect(el, word){
    S.solved++;
    if (S.qFirstTry) S.perfect++;
    S.roundStars++;
    $('#roundStars').textContent = S.roundStars;
    sfxGood();
    if (word) TTS.say(word);
    toast(PRAISE[Math.floor(Math.random() * PRAISE.length)] + ' ★');
    if (el) burstStars(el);
  }

  function nextQuestion(){
    if (S.screen !== 'play') return;
    S.i++;
    if (S.i >= S.qs.length) { finishRound(); return; }
    renderQuestion();
    if (window.scrollY > 6) window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function finishRound(){
    clearTimers();
    var perfectAll = S.perfect === S.qs.length && S.qs.length > 0;
    var bonus = perfectAll ? 3 : 0;
    var earned = S.roundStars + bonus;
    S.roundStars = earned;
    $('#roundStars').textContent = earned;

    var key = S.book + '|' + S.game;
    DB.stars[key] = (Number(DB.stars[key]) || 0) + earned;
    DB.total = (Number(DB.total) || 0) + earned;
    var bestKey = key;
    var prevBest = Number(DB.best[bestKey]) || 0;
    if (earned > prevBest) DB.best[bestKey] = earned;
    persist();
    updateStars();

    var words = S.qs.map(function(q){
      var kind = q.kind || S.game;
      return { w: kind === 'sentence' ? q.answer : q.w, art: q.art || null };
    });

    $('#fStars').innerHTML = '';
    var rating = (perfectAll ? 3 : (S.solved >= Math.ceil(S.qs.length * 0.7) ? 2 : 1));
    for (var si = 0; si < 3; si++) {
      var sp = document.createElement('span');
      sp.className = 'st' + (si < rating ? ' on' : '');
      sp.textContent = '★';
      $('#fStars').appendChild(sp);
    }
    $('#fTitle').textContent = perfectAll ? 'Perfect!' : (S.solved === S.qs.length ? 'You did it!' : 'Good job!');
    $('#fSub').textContent = '맞힌 문제 ' + S.solved + ' / ' + S.qs.length +
      ' · 이번 판 ⭐ ' + earned + (bonus ? ' (보너스 +3)' : '');

    var seen = {};
    $('#fWords').innerHTML = words.filter(function(o){
      if (seen[o.w]) return false;
      seen[o.w] = 1;
      return true;
    }).map(function(o){
      return '<span class="fword">' + (o.art ? svgArt(o.art) : '') + '<span>' + esc(o.w) + '</span></span>';
    }).join('');

    S.screen = 'finish';
    $('#finish').hidden = false;
    if (perfectAll) {
      later(function(){ sfxGood(); }, 120);
      later(function(){ sfxGood(); }, 380);
    } else {
      later(function(){ sfxGood(); }, 120);
    }
  }

  function toast(msg){
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 1150);
  }
  function burstStars(el){
    try {
      var r = el.getBoundingClientRect();
      for (var i = 0; i < 6; i++) {
        var sp = document.createElement('span');
        sp.className = 'burst';
        sp.textContent = ['★', '✦', '★', '✧', '★', '✦'][i % 6];
        sp.style.left = (r.left + r.width / 2 - 10) + 'px';
        sp.style.top = (r.top + r.height / 2 - 10) + 'px';
        sp.style.setProperty('--dx', (Math.random() * 130 - 65).toFixed(0) + 'px');
        sp.style.setProperty('--dy', (-40 - Math.random() * 90).toFixed(0) + 'px');
        sp.style.setProperty('--rot', (Math.random() * 160 - 80).toFixed(0) + 'deg');
        document.body.appendChild(sp);
        (function(node){ setTimeout(function(){ if (node.parentNode) node.parentNode.removeChild(node); }, 950); })(sp);
      }
    } catch (e) {}
  }

  /* =========================================================
     WIRING
     ========================================================= */
  function toggleKo(){
    DB.ko = !DB.ko;
    persist();
    applyKo();
    sfxTap();
  }

  function sayQuestion(q){
    if (!q) return;
    if ((q.kind || S.game) === 'sentence') {
      var parts = q.text.split('{b}');
      if (S.answered) TTS.sayParts([parts[0], q.answer + ' ' + (parts[1] || '')]);
      else TTS.sayParts([parts[0], parts[1]]);
    } else {
      TTS.say(q.w);
    }
  }

  function bind(){
    $$('.book').forEach(function(b){
      b.addEventListener('click', function(){
        sfxTap();
        setBook(b.getAttribute('data-book'));
      });
    });

    $$('.game').forEach(function(g){
      g.addEventListener('click', function(){
        sfxTap();
        ac();
        startGame(g.getAttribute('data-game'));
      });
    });

    $('#koBtn').addEventListener('click', function(){
      toggleKo();
    });
    var k2 = $('#koBtn2');
    if (k2) k2.addEventListener('click', function(){ toggleKo(); });

    $('#backBtn').addEventListener('click', function(){ sfxTap(); showHome(); });
    $('#slowBtn').addEventListener('click', function(){
      DB.slow = !DB.slow;
      persist();
      $('#slowBtn').classList.toggle('on', DB.slow);
      $('#slowBtn').setAttribute('aria-pressed', DB.slow ? 'true' : 'false');
      $('#slowBtn').textContent = '🐢 천천히';
      sfxTap();
      sayQuestion(S.qs[S.i]);
    });

    $('#repeatBtn').addEventListener('click', function(){
      sfxTap();
      sayQuestion(S.qs[S.i]);
    });

    $('#againBtn').addEventListener('click', function(){
      sfxTap();
      $('#finish').hidden = true;
      startGame(S.game);
    });
    $('#homeBtn').addEventListener('click', function(){
      sfxTap();
      $('#finish').hidden = true;
      showHome();
    });

    document.addEventListener('visibilitychange', function(){
      if (document.hidden) TTS.stop();
    });
  }

  function init(){
    TTS.init();
    bind();
    setBook('A');
    updateStars();
    applyKo();
    $('#slowBtn').classList.toggle('on', DB.slow);
    $('#slowBtn').setAttribute('aria-pressed', DB.slow ? 'true' : 'false');
    $('#slowBtn').textContent = '🐢 천천히';
    renderStrip();
    applyKo();
  }

  init();

  /* test hook */
  window.__g = {
    state: function(){
      var q = S.qs[S.i] || null;
      return {
        screen: S.screen, game: S.game, book: S.book, i: S.i, n: S.qs.length,
        kind: q ? (q.kind || S.game) : null,
        sight: q ? !!q.sight : false,
        target: q ? (q.kind === 'sentence' ? q.answer : q.w) : null,
        text: q ? q.text : null,
        options: q && q.kind === 'sentence' ? q.opts : null,
        built: S.built.map(function(b){ return b.ch; }).join(''),
        roundStars: S.roundStars, total: DB.total, solved: S.solved, perfect: S.perfect, firstTry: S.qFirstTry,
        tts: TTS.supported, slow: DB.slow, ko: DB.ko
      };
    },
    counts: function(){
      var L = poolFor('listen'), B = poolFor('build'), Sx = poolFor('sentence'), M = sightMix();
      var kinds = {};
      M.forEach(function(q){ kinds[q.kind] = (kinds[q.kind] || 0) + 1; });
      return {
        book: S.book,
        sightWords: sightWordsAll().length,
        listen: L.length, listenSight: L.filter(function(q){ return q.sight; }).length,
        build: B.length, buildSight: B.filter(function(q){ return q.sight; }).length,
        sentence: Sx.length, sentenceSight: Sx.filter(function(q){ return q.sw; }).length,
        mix: M.length, mixKinds: kinds
      };
    },
    kinds: function(){ return S.qs.map(function(q){ return q.kind || S.game; }); },
    start: function(g){ startGame(g); },
    answer: function(){
      var q = S.qs[S.i];
      if (!q) return null;
      return (q.kind || S.game) === 'sentence' ? q.answer : q.w;
    },
    letters: function(){
      var q = S.qs[S.i];
      return q ? q.w.split('') : null;
    },
    sight: function(){ return SIGHT.map(function(s){ return s.w; }); }
  };
})();
</script>
</body>
</html>
